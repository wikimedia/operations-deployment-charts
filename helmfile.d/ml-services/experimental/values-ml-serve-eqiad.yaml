inference_services:

# Same config as llm-qwen38-27b in the llm namespace, except AITER, to run
# vllm-bench against it without traffic from rest-gateway.
llm_inference_services:
  qwen38-27b:
    model:
      uri: s3://wmf-ml-models/llm/Qwen3.8-27B-FP8/
      name: llm-qwen38-27b
    replicas: 2
    template:
      containers:
        - name: main
          image: docker-registry.discovery.wmnet/ml/amd-vllm032:gfx90agfx942rocm7.2.3pytorch2.13.0flash-attn2.8.3aiter0.1.24.post1vllm0.32.0-1
          resources:
            requests:
              cpu: "16"
              memory: 32Gi
              ephemeral-storage: 35Gi
              amd.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 32Gi
              ephemeral-storage: 40Gi
              amd.com/gpu: "1"
          env:
            # Keep the behavior of the old InferenceService: thinking off by
            # default, and no tools sent to the model when tool_choice is "none".
            # The value is word-split by the preset: JSON must have no spaces.
            # Prefix caching stays off. vLLM enables it by default, but not
            # for hybrid models like Qwen3.8. When it is on, vLLM 0.22.1 uses
            # its experimental Mamba "align" mode, which stopped the engine on
            # clef (EngineDeadError).
            - name: VLLM_ADDITIONAL_ARGS
              value: >-
                --trust-remote-code
                --language-model-only
                --skip-mm-profiling
                --max-model-len 262144
                --kv-cache-dtype fp8
                --gpu-memory-utilization 0.85
                --max-num-seqs 16
                --max-num-batched-tokens 8192
                --block-size 64
                --attention-backend TRITON_ATTN
                --reasoning-parser qwen3
                --enable-auto-tool-choice
                --tool-call-parser qwen3_coder
                --exclude-tools-when-tool-choice-none
                --default-chat-template-kwargs {"enable_thinking":false}
            # AITER is off in llm-qwen38-27b since T425680: on vLLM 0.22.1 it
            # failed to import and then JIT-compiled for too long. Test it again
            # on vLLM 0.32. Attention stays on TRITON_ATTN.
            - name: VLLM_ROCM_USE_AITER
              value: "1"
            - name: TORCH_BLAS_PREFER_HIPBLASLT
              value: "1"
            - name: MAX_JOBS
              value: "1"
            - name: AMDGCN_USE_BUFFER_OPS
              value: "0"
            # Model Runner V2, the default since vLLM 0.32, has slower decode on
            # MI300X with FP8 models. V1 is removed after vLLM 0.33.
            - name: VLLM_USE_V2_MODEL_RUNNER
              value: "0"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: amd.com/gpu.vram
                    operator: In
                    values: ["96G"]
