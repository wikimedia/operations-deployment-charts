inference_services:

  # Verify the Pillow 13.0.0 image before it goes to the llm namespace.
  llm-clef-flash:
    predictor:
      image: "machinelearning-liftwing-inference-services-decision-models-clef"
      image_version: "2026-10-26-083051-publish"
      custom_env:
        - name: MODEL_NAME
          value: "llm-clef-flash"
        - name: STORAGE_URI
          value: "s3://wmf-ml-models/llm/clef-flash/"
        - name: MODEL_PATH
          value: "/mnt/models"
        # vLLM runs the Qwen backbone; the clef joint schema head runs in torch.
        - name: WARMUP
          value: "True"
        - name: GPU_MEMORY_UTILIZATION
          value: "0.85"
        - name: VLLM_ROCM_USE_AITER
          value: "0"
        - name: TORCH_BLAS_PREFER_HIPBLASLT
          value: "1"
        - name: MAX_JOBS
          value: "1"
        - name: AMDGCN_USE_BUFFER_OPS
          value: "0"
      container:
        resources:
          limits:
            cpu: "16"
            # Host RSS peaks at 18.7 GiB while loading the safetensors shards
            # before settling at ~3 GiB; 16Gi would OOMKill the pod mid-load.
            memory: 32Gi
            amd.com/gpu: "1"
            ephemeral-storage: 30Gi
          requests:
            cpu: "8"
            memory: 24Gi
            amd.com/gpu: "1"
            # The checkpoint is 15.3 GiB; the storage-initializer writes it to
            # the pod before the server reads it.
            ephemeral-storage: 25Gi
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
      config:
        maxReplicas: 1
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoSchedule"
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoExecute"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "kubernetes.io/hostname"
                      operator: "In"
                      values:
                        # 18.7 GiB VRAM resident: needs a 96GB partition (1015 is 24GB).
                        - "ml-serve1013.eqiad.wmnet"
                        - "ml-serve1014.eqiad.wmnet"
