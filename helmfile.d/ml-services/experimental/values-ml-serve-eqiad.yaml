inference_services:

  # Copy of cope-b-a4b from the llm ns.
  cope-b-a4b:
    predictor:
      image: "machinelearning-liftwing-inference-services-policy-violation-cope-b-a4b"
      image_version: "2026-07-06-073804-publish"
      custom_env:
        - name: MODEL_NAME
          value: "cope-b-a4b"
        - name: STORAGE_URI
          value: "s3://wmf-ml-models/llm/cope-b-a4b/"
        - name: MODEL_PATH
          value: "/mnt/models"
        - name: TRUST_REMOTE_CODE
          value: "False"
        - name: DTYPE
          value: "bfloat16"
        - name: MAX_MODEL_LEN
          value: 16384
      container:
        resources:
          limits:
            cpu: "6"
            memory: 16Gi
            amd.com/gpu: "1"
            ephemeral-storage: 65Gi
          requests:
            cpu: "6"
            memory: 16Gi
            amd.com/gpu: "1"
            ephemeral-storage: 60Gi
      config:
        maxReplicas: 1
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoSchedule"
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoExecute"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "kubernetes.io/hostname"
                      operator: "In"
                      values:
                        # T439555: Host it using the 96GB partitions.
                        - "ml-serve1013.eqiad.wmnet"
                        - "ml-serve1014.eqiad.wmnet"

  # Copy of llm-clef-flash from the llm ns, served with vLLM instead of
  # HF transformers, to test it on MI300X before we replace the llm one
  # (T440223). Same MODEL_NAME, so requests are the same as for llm.
  llm-clef-flash-vllm:
    predictor:
      image: "machinelearning-liftwing-inference-services-decision-models-clef"
      image_version: "2026-10-14-101821-publish"
      custom_env:
        - name: MODEL_NAME
          value: "llm-clef-flash"
        - name: STORAGE_URI
          value: "s3://wmf-ml-models/llm/clef-flash-fp8/20261014115722/"
        - name: MODEL_PATH
          value: "/mnt/models"
        # vLLM runs the Qwen backbone; the clef joint schema head runs in torch.
        - name: WARMUP
          value: "True"
        - name: GPU_MEMORY_UTILIZATION
          value: "0.85"
        # Same ROCm settings as the other vLLM services on ml-serve1013/1014.
        - name: VLLM_ROCM_USE_AITER
          value: "0"
        - name: TORCH_BLAS_PREFER_HIPBLASLT
          value: "1"
        - name: MAX_JOBS
          value: "1"
        - name: AMDGCN_USE_BUFFER_OPS
          value: "0"
        # using cpu for lm_head as it is causing increased latencies when using smaller GPU partitions
        # vllm doesn't use this so the base model is still on GPU
        - name: DEVICE
          value: "cpu"
      container:
        resources:
          limits:
            cpu: "8"
            memory: 20Gi
            amd.com/gpu: "1"
            ephemeral-storage: 20Gi
          requests:
            cpu: "4"
            memory: 20Gi
            amd.com/gpu: "1"
            ephemeral-storage: 15Gi
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
      config:
        minReplicas: 4
        maxReplicas: 4
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoSchedule"
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoExecute"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "kubernetes.io/hostname"
                      operator: "In"
                      values:
                        - "ml-serve1015.eqiad.wmnet"
