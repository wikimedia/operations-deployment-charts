inference_services:

  # policy-violation isvc
  cope-a-9b:
    predictor:
      image: "machinelearning-liftwing-inference-services-policy-violation-cope-a-9b"
      image_version: "2026-07-07-081557-publish"
      custom_env:
        - name: MODEL_NAME
          value: "cope-a-9b"
        - name: STORAGE_URI
          value: "s3://wmf-ml-models/cope-a-9b-merged/"
        - name: MODEL_PATH
          value: "/mnt/models"
        - name: TRUST_REMOTE_CODE
          value: "False"
        - name: MAX_MODEL_LEN
          value: 4096
      container:
        resources:
          limits:
            cpu: "6"
            memory: 16Gi
            amd.com/gpu: "1"
            ephemeral-storage: 30Gi
          requests:
            cpu: "6"
            memory: 16Gi
            amd.com/gpu: "1"
            ephemeral-storage: 25Gi
      config:
        maxReplicas: 1
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoSchedule"
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoExecute"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "kubernetes.io/hostname"
                      operator: "In"
                      values:
                        - "ml-serve1013.eqiad.wmnet"

  # Copy of llm-qwen3-14b from the llm ns, pinned to ml-serve1015
  # (24GB partitions) for the MI300X tuning benchmark (T431553)
  llm-qwen3-14b-24gb:
    predictor:
      image: "machinelearning-liftwing-inference-services-qwen36"
      image_version: "2026-08-25-153535-publish"
      custom_env:
        - name: MODEL_NAME
          value: "llm-qwen3-14b"
        - name: STORAGE_URI
          value: "s3://wmf-ml-models/llm/qwen3-14b-fp8/"
        - name: MODEL_PATH
          value: "/mnt/models"
        - name: TRUST_REMOTE_CODE
          value: "True"
        - name: DTYPE
          value: "auto"
        - name: KV_CACHE_DTYPE
          value: "fp8"
        - name: GPU_MEMORY_UTILIZATION
          value: "0.92"
        - name: MAX_MODEL_LEN
          value: "16384"
        - name: TENSOR_PARALLEL_SIZE
          value: "1"
        - name: MAX_NUM_SEQS
          value: "32"
        - name: MAX_NUM_BATCHED_TOKENS
          value: "8192"
        - name: BLOCK_SIZE
          value: "64"
        - name: ATTENTION_BACKEND
          value: "TRITON_ATTN"
        - name: ENFORCE_EAGER
          value: "False"
        - name: TOOL_CALLING_ENABLED
          value: "True"
        - name: VLLM_ROCM_USE_AITER
          value: "0"
        - name: TORCH_BLAS_PREFER_HIPBLASLT
          value: "1"
        - name: MAX_JOBS
          value: "1"
        - name: AMDGCN_USE_BUFFER_OPS
          value: "0"
      container:
        resources:
          limits:
            cpu: "16"
            memory: 16Gi
            amd.com/gpu: "1"
            ephemeral-storage: 35Gi
          requests:
            cpu: "16"
            memory: 16Gi
            amd.com/gpu: "1"
            ephemeral-storage: 30Gi
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
      config:
        minReplicas: 2
        maxReplicas: 2
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoSchedule"
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoExecute"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "kubernetes.io/hostname"
                      operator: "In"
                      values:
                        - "ml-serve1015.eqiad.wmnet"
