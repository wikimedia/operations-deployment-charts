inference_services:

  # Copy of cope-b-a4b from the llm ns.
  cope-b-a4b:
    predictor:
      image: "machinelearning-liftwing-inference-services-policy-violation-cope-b-a4b"
      image_version: "2026-07-06-073804-publish"
      custom_env:
        - name: MODEL_NAME
          value: "cope-b-a4b"
        - name: STORAGE_URI
          value: "s3://wmf-ml-models/llm/cope-b-a4b/"
        - name: MODEL_PATH
          value: "/mnt/models"
        - name: TRUST_REMOTE_CODE
          value: "False"
        - name: DTYPE
          value: "bfloat16"
        - name: MAX_MODEL_LEN
          value: 16384
      container:
        resources:
          limits:
            cpu: "6"
            memory: 16Gi
            amd.com/gpu: "1"
            ephemeral-storage: 65Gi
          requests:
            cpu: "6"
            memory: 16Gi
            amd.com/gpu: "1"
            ephemeral-storage: 60Gi
      config:
        maxReplicas: 1
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoSchedule"
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoExecute"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "kubernetes.io/hostname"
                      operator: "In"
                      values:
                        # T439555: Host it using the 96GB partitions.
                        - "ml-serve1013.eqiad.wmnet"
                        - "ml-serve1014.eqiad.wmnet"

  # Rerun the vllm-bench, it will be removed after the tests
  llm-qwen38-27b:
    predictor:
      image: "machinelearning-liftwing-inference-services-qwen36"
      image_version: "2026-08-25-153535-publish"
      custom_env:
        - name: MODEL_NAME
          value: "llm-qwen38-27b"
        - name: STORAGE_URI
          value: "s3://wmf-ml-models/llm/Qwen3.8-27B-FP8/"
        - name: MODEL_PATH
          value: "/mnt/models"
        - name: TRUST_REMOTE_CODE
          value: "True"
        - name: LANGUAGE_MODEL_ONLY
          value: "True"
        - name: SKIP_MM_PROFILING
          value: "True"
        - name: DTYPE
          value: "auto"
        - name: KV_CACHE_DTYPE
          value: "fp8"
        - name: GPU_MEMORY_UTILIZATION
          value: "0.85"
        - name: MAX_MODEL_LEN
          value: "32768"
        - name: TENSOR_PARALLEL_SIZE
          value: "1"
        - name: MAX_NUM_SEQS
          value: "32"
        - name: MAX_NUM_BATCHED_TOKENS
          value: "32768"
        - name: BLOCK_SIZE
          value: "64"
        - name: ATTENTION_BACKEND
          value: "TRITON_ATTN"
        - name: ENFORCE_EAGER
          value: "False"
        - name: TOOL_CALLING_ENABLED
          value: "True"
        - name: TOOL_CALL_PARSER
          value: "qwen3_coder"
        - name: VLLM_ROCM_USE_AITER
          value: "0"
        - name: TORCH_BLAS_PREFER_HIPBLASLT
          value: "1"
        - name: MAX_JOBS
          value: "1"
        - name: AMDGCN_USE_BUFFER_OPS
          value: "0"
      container:
        resources:
          limits:
            cpu: "16"
            memory: 32Gi
            amd.com/gpu: "1"
            ephemeral-storage: 40Gi
          requests:
            cpu: "16"
            memory: 32Gi
            amd.com/gpu: "1"
            ephemeral-storage: 35Gi
        volumeMounts:
          - mountPath: /dev/shm
            name: dshm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "8Gi"
      config:
        minReplicas: 1
        maxReplicas: 1
        timeout: 600
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoSchedule"
          - key: "dedicated"
            operator: "Equal"
            value: "mi300x-experiments"
            effect: "NoExecute"
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: "kubernetes.io/hostname"
                      operator: "In"
                      values:
                        # T439555: Medium model we want to host it using the 96GB partitions.
                        - "ml-serve1013.eqiad.wmnet"
                        - "ml-serve1014.eqiad.wmnet"