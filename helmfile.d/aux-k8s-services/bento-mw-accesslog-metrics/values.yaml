---
app:
  version: 1.21.1-1

  kafka:
    topics_in:
      - mediawiki.httpd.accesslog
    topic_out: ~
    consumer_group: bento-mw-accesslog-metrics
    batching:
      period: 1000ms
      count: 32768
      byte_size: ~

  requests:
    cpu: 5      #8
    memory: 3Gi #4
  limits:
    cpu: 5      #8 # rate(container_cpu_usage_seconds_total{cluster="syslog", id="/system.slice/system-benthos.slice/benthos@mw_accesslog_metrics.service"}[5m])
    memory: 3Gi #4 # container_memory_usage_bytes{cluster="syslog", id="/system.slice/system-benthos.slice/benthos@mw_accesslog_metrics.service"}

resources:
  replicas: 2

monitoring:
  enabled: true

service:
  deployment: production

networkpolicy:
  egress:
    enabled: true
