mwcron:
  enabled: true
  suspended_jobs: []

main_app:
  requests:
    auto_compute: false
    cpu: 1000m
    memory: 1000Mi
  limits:
    enforce: true
    auto_compute: false
    cpu: 1000m
    memory: ~

mw:
  helpers:
    feature_flags:
      default:
        native_sidecars: false
  httpd:
    enabled: false
  logging:
    rsyslog: true
  helpers:
    feature_flags:
      periodic:
        networkpolicy: false

# These are enabled to check the pod.kubernetes.io/sidecars annotation
cache:
  mcrouter:
    enabled: true

mesh:
  enabled: true
  sidecar: false
  public_port: ~

monitoring:
  statsd: ~
