# See T328683 for more info
monitoring:
  exporter_resources:
    requests:
      cpu: 500m
    limits:
      cpu: 1000m

rollingUpdateStrategy:
  # we can tolerate being under capacity for a while during a
  # rollout. Don't surge so that we don't hit namespace limits.
  maxSurge: 0
  maxUnavailable: 5

main_app:
  requests:
    cpu: 1.5
    memory: 2000Mi
  limits:
    cpu: 2
    memory: 2000Mi


resources:
  replicas: 30

# NOTE: Historically, changeprop-jobqueue exposed a NodePort Service. This is
# no longer the case, and it exposes no Service at all (see mesh configuration
# in value.yaml). Howevever, we retain a minimal 'service' values map (without
# port info), since the names therein have other configuration use cases.
service:
  name: "cpjobqueue"
  deployment: "production"
