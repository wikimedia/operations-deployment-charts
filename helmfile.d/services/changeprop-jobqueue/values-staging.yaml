main_app:
  limits:
    memory: 1024Mi

  log_level: info

  site: staging

  kafka:
    broker_list:
      - kafka-main1006.eqiad.wmnet:9093
      - kafka-main1007.eqiad.wmnet:9093
      - kafka-main1008.eqiad.wmnet:9093
      - kafka-main1009.eqiad.wmnet:9093
      - kafka-main1010.eqiad.wmnet:9093

nutcracker:
  enabled: true
  servers:
    - rdb1015.eqiad.wmnet:6379:1 "cp-1"
    - rdb1013.eqiad.wmnet:6379:1 "cp-2"

resources:
  replicas: 1

# NOTE: Historically, changeprop-jobqueue exposed a NodePort Service. This is
# no longer the case, and it exposes no Service at all (see mesh configuration
# in value.yaml). Howevever, we retain a minimal 'service' values map (without
# port info), since the names therein have other configuration use cases.
service:
  name: cpjobqueue-staging
  deployment: "production"
