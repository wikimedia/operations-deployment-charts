helmDefaults:
  createNamespace: false
  verify: false
  atomic: true
  timeout: 600
  force: false
  args:
    # kubeconfig file can be overwritten using the environment state value kubeConfig (e.g. to deploy to staging-codfw).
    # Use the following example as a reference:
    # helmfile --state-values-set kubeConfig=/path/to/config -e environment apply
    - --kubeconfig
    - {{ .Environment.Values | get "kubeConfig" (printf "/etc/kubernetes/editcheck-headless-deploy-%s.config" .Environment.Name) }}

environments:
  staging:
    values:
      - releases: [main]
      - "/etc/helmfile-defaults/clusterinfo-{{ .Environment.Name }}.yaml"
    missingFileHandler: Warn
  eqiad:
    values:
      - releases: [main]
      - "/etc/helmfile-defaults/clusterinfo-{{ .Environment.Name }}.yaml"
    missingFileHandler: Warn
  codfw:
    values:
      - releases: [main]
      - "/etc/helmfile-defaults/clusterinfo-{{ .Environment.Name }}.yaml"
    missingFileHandler: Warn

---

bases:
  - ../global.yaml

templates:
  default: &default
    namespace: editcheck-headless
    # Despite its name the python-webapp chart is not python-specific: it is a
    # minimal application plus service-mesh chart, and other non-python
    # services use it.
    chart: wmf-stable/python-webapp
    # Allow to forcibly recreate pods by passing --state-values-set roll_restart=1 on the command line
    recreatePods: {{ if (hasKey .Environment.Values "roll_restart") }}{{ eq .Environment.Values.roll_restart 1 }}{{ else }}false{{end}}
    installedTemplate: '{{`{{ if hasKey .Environment.Values "releases" }}{{ has .Release.Name .Environment.Values.releases }}{{ else }}{{ "no releases defined for this environment" | fail }}{{end}}`}}'
    missingFileHandler: Warn
    values:
      - "/etc/helmfile-defaults/general-{{ .Environment.Name }}.yaml" # general default values, controlled by SRE
      - "values.yaml" # non-env-specific values, in this repository
      - "/etc/helmfile-defaults/private/main_services/editcheck-headless/{{ .Environment.Name }}.yaml" # prod-specific secrets, controlled by SRE
      - "values-{{ .Environment.Name }}.yaml" # env-specific overrides
      - "values-{{`{{ .Release.Name }}`}}.yaml" # release-specific overrides

hooks:
  - events: ["prepare"]
    command: "helmfile_log_sal"
    args:
      [
        "{{`{{.HelmfileCommand}}`}}",
        "[{{`{{ .Environment.Name }}`}}] START helmfile.d/services/editcheck-headless: {{`{{.HelmfileCommand}}`}}",
      ]
  - events: ["cleanup"]
    command: "helmfile_log_sal"
    args:
      [
        "{{`{{.HelmfileCommand}}`}}",
        "[{{`{{ .Environment.Name }}`}}] DONE helmfile.d/services/editcheck-headless: {{`{{.HelmfileCommand}}`}}",
      ]

releases:
  - name: main
    <<: *default
