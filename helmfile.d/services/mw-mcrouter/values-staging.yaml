cache:
  mcrouter:
    # Testing for T420223
    extra_args: "--reset-inactive-connection-interval=0 --keepalive-idle=300 --keepalive-interval=10 --keepalive-count=3"
    route_prefix: eqiad/mw
    zone: eqiad
    routes:
      - route: /eqiad/mw
        pool: eqiad-servers
        failover_time: 600
      - route: /codfw/mw
        pool: codfw-servers
        failover_time: 600
      - route: /eqiad/mw-wan
        failover_time: 600
        pool: eqiad-servers
        replica:
          route: /codfw/mw-wan
          pool: codfw-servers
    resources:
      requests:
        cpu: 0.5
        memory: 192Mi
      limits:
        cpu: 1
        memory: 1024Mi
