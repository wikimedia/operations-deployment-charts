crawler:
  enabled: false

mcrouter:
  zone: codfw
  route_prefix: codfw/toolhub
  routes:
    - route: /codfw/toolhub
      type: standalone
      failover: true
      # Pool config from /etc/helmfile-defaults/mediawiki/mcrouter_pools.yaml
      pool: codfw-servers

config:
  public:
    DB_HOST: m5-master.codfw.wmnet
    http_proxy: http://urldownloader.svc.codfw.wmnet:8080
    https_proxy: http://urldownloader.svc.codfw.wmnet:8080
