# Setup for the [staging cluster](https://wikitech.wikimedia.org/wiki/Kubernetes/Clusters#staging).
# The staging cluster uses real upstream services, but not all are available.
# Its purpose is to verify a release of the REST gateway before it gets applied to the
# production clusters.

resources:
  replicas: 1

# Settings for the end-to-end tests defined under tests/e2e.
smokepy:
  gateway:
    # The target URL to use for end-to-end tests.
    # Can also be set using $GATEWAY_TEST_TARGET_URL.
    target_url: https://staging.svc.eqiad.wmnet:4113
    host: en.wikipedia.org
    headers: {}

    # The path of the endpoint to probe when testing the default rate limit policy.
    default_policy_endpoint: "/en.wikipedia.org/v1/page/title/X"

    # The path of the endpoint to probe when testing the shadow rate limit policy.
    # Doesn't have to be an existing action API module since missing modules still produce status 200.
    shadow_policy_endpoint: "/w/api.php?action=shadowed&format=json"

    # The path of the endpoint to probe when testing time limit policy handling.
    # Use a fake action (instead of action=parse) so ONLY the time limit applies.
    # Doesn't have to be an existing action API module since missing modules still produce status 200.
    timelimit_endpoint: "/w/api.php?action=timelimited&format=json"

    # The path of the endpoint to probe when testing for RESTbase compatibility CORS behavior
    cors_rb_compat_endpoint: "/en.wikipedia.org/v1/page/title/X"

    # The path of the endpoint to probe when testing default CORS behavior for upstream responses
    cors_upstream_endpoint: "/w/api.php?action=query&meta=siteinfo&format=json"

    # Endpoint that should be exempt from JWT checks
    jwt_exempt_endpoint: "/w/rest.php/oauth2/"

    # Endpoint that should require a JWT
    jwt_required_endpoint: "/w/api.php?action=compare&format=json"

main_app:
  # enable debug logging in staging
  args: ["-l", "debug"]
  domains:
    - staging.svc.eqiad.wmnet:*
    - staging.svc.eqiad.wmnet
    - rest-gateway.discovery.wmnet:*
    - rest-gateway.discovery.wmnet
    - rest-gateway-ro.discovery.wmnet:*
    - rest-gateway-ro.discovery.wmnet
    - "*.wikipedia.org"
    - "*.m.mediawiki.org"
    - "*.m.wikibooks.org"
    - "*.m.wikidata.org"
    - "*.m.wikimedia.org"
    - "*.m.wikimediafoundation.org"
    - "*.m.wikinews.org"
    - "*.m.wikipedia.org"
    - "*.m.wikiquote.org"
    - "*.m.wikisource.org"
    - "*.m.wikiversity.org"
    - "*.m.wikivoyage.org"
    - "*.m.wiktionary.org"
    - "*.mediawiki.org"
    - "*.planet.wikimedia.org"
    - "*.wikibooks.org"
    - "*.wikidata.org"
    - "*.wikimedia.org"
    - "*.wikimediafoundation.org"
    - "*.wikinews.org"
    - "*.wikiquote.org"
    - "*.wikisource.org"
    - "*.wikiversity.org"
    - "*.wikivoyage.org"
    - "*.wiktionary.org"
    - "*.wmfusercontent.org"
    - "*.zero.wikipedia.org"
    - mediawiki.org
    - w.wiki
    - wikibooks.org
    - wikidata.org
    - wikimedia.org
    - wikimediafoundation.org
    - wikinews.org
    - wikiquote.org
    - wikisource.org
    - wikiversity.org
    - wikivoyage.org
    - wiktionary.org
    - wmfusercontent.org
    - wikipedia.org
    # required for service mesh
    - "localhost:6033"
  ratelimiter:
    enabled: true
    lua_hook_enabled: true
    log_level: debug
    honor_debug_flags: true # allow x-wmf-debug-flags header
    redis_host: localhost
    redis_port: 6379
    key_prefix: "staging_restgw_"
    key_log_format: "%REQ(x-wmf-ratelimit-class)%:%REQ(x-wmf-user-id)%@%REQ(x-wmf-ratelimit-policy)%"
    envoy_timeout: 0.5
    units: [ MINUTE ]
    policies:

      "May2026":
        shadow_mode: false
        limits:
          "*": # catch-all limits
            MINUTE: 1
          "anon": # no auth, not a browser, no good User-Agent, no known IP
            MINUTE: 1
          "anon-browser": # no auth, but looks like a browser
            MINUTE: 3
          "anon-app": # no auth, but looks like our app
            MINUTE: 4
          "anon-cgnat": # clients behind a CGNAT
            MINUTE: 5
          "unauthed-bot": # no auth, but good User-Agent -- temp?
            MINUTE: 7
          "anon-mediawiki": # InstantCommons and such (without contact info)
            MINUTE: 4
          "unauthed-mediawiki": # InstantCommons and such (with contact info)
            MINUTE: 9
          "authed-user": # valid JWT
            MINUTE: 11
          "established-user": # valid JWT, meets age/edit count criteria
            MINUTE: 13
          "highlimits-user": # valid WT and member of specific global groups
            MINUTE: 15
          "approved-bot": # bot approved by the community
            MINUTE: 17
          "known-client": # no auth, network associated with a known client
            MINUTE: 19
          "known-network": # no auth, network under outbound control (WMCS, WME)
            MINUTE: 21

      "Shadow":
        shadow_mode: true
        limits:
          "*": # catch-all limits
            MINUTE: 1
          "anon": # no auth, not a browser, no good User-Agent, no known IP
            MINUTE: 1
          "anon-browser": # no auth, but looks like a browser
            MINUTE: 2
          "anon-app": # no auth, but looks like our app
            MINUTE: 3
          "anon-cgnat": # clients behind a CGNAT
            MINUTE: 4
          "unauthed-bot": # no auth, but good User-Agent -- temp?
            MINUTE: 6
          "anon-mediawiki": # InstantCommons and such (without contact info)
            MINUTE: 3
          "unauthed-mediawiki": # InstantCommons and such (with contact info)
            MINUTE: 8
          "authed-user": # valid JWT
            MINUTE: 10
          "established-user": # valid JWT, meets age/edit count criteria
            MINUTE: 12
          "highlimits-user": # valid WT and member of specific global groups
            MINUTE: 14
          "approved-bot": # bot approved by the community
            MINUTE: 16
          "known-client": # no auth, network associated with a known client
            MINUTE: 17
          "known-network": # no auth, network under outbound control (WMCS, WME)
            MINUTE: 19

      "AbstractWiki":
        shadow_mode: false
        upfront_cost: 2
        limits:
          "*": # catch-all limits
            MINUTE: 10
          "anon": # no auth, not a browser, no good User-Agent, no known IP
            MINUTE: 10
          "anon-browser": # no auth, but looks like a browser
            MINUTE: 30
          "anon-app": # no auth, but looks like our app
            MINUTE: 40
          "anon-cgnat": # clients behind a CGNAT
            MINUTE: 50
          "unauthed-bot": # no auth, but good User-Agent -- temp?
            MINUTE: 70
          "anon-mediawiki": # InstantCommons and such (without contact info)
            MINUTE: 40
          "unauthed-mediawiki": # InstantCommons and such (with contact info)
            MINUTE: 90
          "authed-user": # valid JWT
            MINUTE: 110
          "established-user": # valid JWT, meets age/edit count criteria
            MINUTE: 130
          "highlimits-user": # valid WT and member of specific global groups
            MINUTE: 150
          "approved-bot": # bot approved by the community
            MINUTE: 170
          "known-client": # no auth, network associated with a known client
            MINUTE: 190
          "known-network": # no auth, network under outbound control (WMCS, WME)
            MINUTE: 210

      "LiftWing":
        shadow_mode: false
        limits:
          "*": # catch-all limits
            MINUTE: 0
          "anon": # no auth, not a browser, no good User-Agent, no known IP
            MINUTE: 0
          "anon-browser": # no auth, but looks like a browser
            MINUTE: 0
          "anon-app": # no auth, but looks like our app
            MINUTE: 0
          "anon-cgnat": # clients behind a CGNAT
            MINUTE: 0
          "unauthed-bot": # no auth, but good User-Agent -- temp?
            MINUTE: 0
          "anon-mediawiki": # InstantCommons and such (without contact info)
            MINUTE: 0
          "unauthed-mediawiki": # InstantCommons and such
            MINUTE: 0
          "authed-user": # valid JWT
            MINUTE: 2
          "established-user": # valid JWT, meets age/edit count criteria
            MINUTE: 4
          "highlimits-user": # valid WT and member of specific global groups
            MINUTE: 6
          "approved-bot": # bot approved by the community
            MINUTE: 8
          "known-client": # no auth, network associated with a known client
            MINUTE: 10
          "known-network": # no auth, network under outbound control (WMCS, WME)
            MINUTE: 12

      "ParseCost":
        shadow_mode: false
        measure: time
        upfront_cost: 100
        limits:
          "*": # catch-all limits
            MINUTE: 600
          "anon": # no auth, not a browser, no good User-Agent, no known IP
            MINUTE: 650
          "anon-browser": # no auth, but looks like a browser
            MINUTE: 700
          "anon-app": # no auth, but looks like our app
            MINUTE: 750
          "anon-cgnat": # clients behind a CGNAT
            MINUTE: 800
          "unauthed-bot": # no auth, but good User-Agent -- temp?
            MINUTE: 850
          "anon-mediawiki": # InstantCommons and such (without contact info)
            MINUTE: 900
          "unauthed-mediawiki": # InstantCommons and such
            MINUTE: 950
          "authed-user": # valid JWT
            MINUTE: 1000
          "established-user": # valid JWT, meets age/edit count criteria
            MINUTE: 1050
          "highlimits-user": # valid WT and member of specific global groups
            MINUTE: 1100
          "approved-bot": # bot approved by the community
            MINUTE: 1200
          "known-client": # no auth, network associated with a known client
            MINUTE: 1300
          "known-network": # no auth, network under outbound control (WMCS, WME)
            MINUTE: 1400

    enable_x_ratelimit_headers: true

  access_log:
    debug: true
    sample_percentage: 100
    ratelimit_sample_percentage: 100

  # NOTE: extra_rest_gateway_routes is prepended to the normal rest_gateway_routes
  # to allow us to test features that are not yet present on any production route.
  extra_rest_gateway_routes:
    # Fake API module for testing test shadow mode
    - name: mw-action-api-shadowed
      # We set a higher timeout to allow for long queries on the search API
      timeout: 53s
      # Exclude cspreports action API calls from rate limits
      cluster_specifier_plugin: mw-api
      csp_enabled: false
      urls:
        - name: shadowed
          in: '/+w/api.php(.*)'
          out: '/w/api.php\1'
          query_parameters:
            - name: action
              string_match:
                # this does not exist in the real API
                exact: 'shadowed'
                ignore_case: true
      rate_limit_policies: [ "Shadow", "BYPASS" ]

    # Fake API module for testing test shadow mode
    - name: mw-action-api-timelimited
      # We set a higher timeout to allow for long queries on the search API
      timeout: 53s
      # Exclude cspreports action API calls from rate limits
      cluster_specifier_plugin: mw-api
      csp_enabled: false
      urls:
        - name: timelimited
          in: '/+w/api.php(.*)'
          out: '/w/api.php\1'
          query_parameters:
            - name: action
              string_match:
                # this does not exist in the real API
                exact: 'timelimited'
                ignore_case: true
      rate_limit_policies: [ "ParseCost", "BYPASS" ]

    - name: staging-mw-action-api-jwt-required
      timeout: 53s
      # Require JWT for action=compare, just to test the mechanism.
      # The JWT can be provided as a bearer token or as a session cookie.
      jwt: required
      cluster_specifier_plugin: mw-api
      csp_enabled: false
      urls:
        - name: compare
          in: '/+w/api.php(.*)'
          out: '/w/api.php\1'
          query_parameters:
            - name: action
              string_match:
                exact: 'compare'
                ignore_case: true

    ##########################################################################################
    # T433752: Begin duplication of MediaWiki API routes for cluster specifier plugin testing.

    - name: mw-api-ext
      timeout: 15s
      cluster_specifier_plugin: mw-api
      request_headers_to_add:
        - key: x-restbase-compat
          value: true
      stat_prefix: restbase-compat
      urls:
        # T374683
        # NOTE: Revision regexps come first as the title regexps are broad
        # enough to match the revision ones as well, ordering to the rescue
        # NOTE: The REST gateway, in the same spirit as RESTBase before it,
        # assumes the caller will be URL encoding the page titles so that if
        # they have slashes in them.
        #
        # e.g. Foo/Bar/Baz should become Foo%2FBar%2FBaz
        #
        # before reaching REST gateway.
        # In case a non URL encoded page with slashes is submitted, it's the
        # duty of MediaWiki to return the appropriate response (and MediaWiki
        # does return a 404)
        - name: page-metadata-revision
          in: '/+([^/]+)/v1/page/title/([^\/]+)/(.+)'
          out: '/w/rest.php/v1/revision/\3/bare'
        - name: page-metadata-title
          in: '/+([^/]+)/v1/page/title/(.+)'
          out: '/w/rest.php/v1/page/\2/bare'
        - name: page-html-revision
          in: '/+([^/]+)/v1/page/html/([^\/]+)/(.+)'
          out: '/w/rest.php/v1/revision/\3/html'
        - name: page-html-title
          in: '/+([^/]+)/v1/page/html/(.+)'
          out: '/w/rest.php/v1/page/\2/html'
        - name: page-lint-revision
          in: '/+([^/]+)/v1/page/lint/([^\/]+)/(.+)'
          out: '/w/rest.php/v1/revision/\3/lint'
        - name: page-lint-title
          in: '/+([^/]+)/v1/page/lint/([^\/]+)'
          out: '/w/rest.php/v1/page/\2/lint'
        - name: transform_wikitext_to_html
          in: '/+([^/]+)/v1/transform/wikitext/to/html(.*)'
          out: '/w/rest.php/v1/transform/wikitext/to/html\2'
        - name: transform_html_to_wikitext
          in: '/+([^/]+)/v1/transform/html/to/wikitext(.*)'
          out: '/w/rest.php/v1/transform/html/to/wikitext\2'
        - name: transform_wikitext_to_lint
          in: '/+([^/]+)/v1/transform/wikitext/to/lint(.*)'
          out: '/w/rest.php/v1/transform/wikitext/to/lint\2'
        # reading lists endpoint - supports all HTTP verbs for various options
        # Note use of * rather than + in regex - needed to match base
        # `/v1/data/lists/` requests which requires the trailing slash
        - name: lists
          in: '/+([^/]+)/v1/data/lists/(.*)'
          out: '/w/rest.php/readinglists/v0/lists/\2'
        # T397203: non-restbase replacement for the old /?spec path that returned JSON
        - name: spec-json-wikimedia
          in: '/wikimedia\.org/v1/'
          out: '/api/restbase_specs/rest_v1-wikimedia.json'
          to: meta.wikimedia.org
          query_parameters:
            - name: spec
              present_match: true
        - name: spec-json-wikidata
          in: '/(www|test)\.wikidata\.org/v1/'
          out: '/api/restbase_specs/rest_v1-wikidata.json'
          query_parameters:
            - name: spec
              present_match: true
        - name: spec-json-commons
          in: '/(commons|test-commons)\.wikimedia\.org/v1/'
          out: '/api/restbase_specs/rest_v1-commons.json'
          query_parameters:
            - name: spec
              present_match: true
        - name: spec-json-wikipedia
          in: '/[^./]+\.wikipedia\.org/v1/'
          out: '/api/restbase_specs/rest_v1-wikipedia.json'
          query_parameters:
            - name: spec
              present_match: true
        - name: spec-json-wiktionary
          in: '/[^./]+\.wiktionary\.org/v1/'
          out: '/api/restbase_specs/rest_v1-wiktionary.json'
          query_parameters:
            - name: spec
              present_match: true
        - name: spec-json-wikivoyage
          in: '/[^./]+\.wikivoyage\.org/v1/'
          out: '/api/restbase_specs/rest_v1-wikivoyage.json'
          query_parameters:
            - name: spec
              present_match: true
        - name: spec-json-default
          in: '/(wikisource|www\.mediawiki|[^./]+\.(wikisource|wikibooks|wikiversity|wikiquote|wikinews|wikimedia))\.org/v1/'
          out: '/api/restbase_specs/rest_v1-default.json'
          query_parameters:
            - name: spec
              present_match: true
      rb_response_headers: true

    - name: mw-rest-auth
      timeout: 15s
      cluster_specifier_plugin: mw-api
      csp_enabled: false
      jwt: allow_missing_or_failed
      rate_limit_policies: [ "BYPASS", "BYPASS" ]
      urls:
        - name: oauth2
          in: '/+w/rest.php/oauth2(.*)'
          out: '/w/rest.php/oauth2\1'
    - name: mw-rest-php
      timeout: 15s
      # This set of routes uses the same cluster as mw-api-ext - however
      # it does NOT use the restbase compability headers as this will
      # lead to incorrect responses from the mw APIs.

      # These routes also do not use the restbase response headers as
      # we will either need to put in a more specific set of headers
      # befitting the mw apis, or to simply defer to the headers
      # mediawiki sends.

      cluster_specifier_plugin: mw-api
      csp_enabled: false
      urls:
        # *** BEGIN rest.php APIs ***
        # campaignevents
        - name: campaignevents
          in: '/+w/rest.php/campaignevents(.*)'
          out: '/w/rest.php/campaignevents\1'
        # checkuser
        - name: checkuser
          in: '/+w/rest.php/checkuser(.*)'
          out: '/w/rest.php/checkuser\1'
        # eventbus
        - name: eventbus
          in: '/+w/rest.php/eventbus(.*)'
          out: '/w/rest.php/eventbus\1'
        # growthexperiments
        - name: growthexperiments
          in: '/+w/rest.php/growthexperiments(.*)'
          out: '/w/rest.php/growthexperiments\1'
        # ipinfo
        - name: ipinfo
          in: '/+w/rest.php/ipinfo(.*)'
          out: '/w/rest.php/ipinfo\1'
        # mathoid?
        - name: math_html
          in: '/+w/rest.php/math/v0/popup/html(.*)'
          out: '/w/rest.php/math/v0/popup/html\1'
        # reportincident
        - name: reportincident
          in: '/+w/rest.php/reportincident/v0/report'
          out: '/w/rest.php/reportincident/v0/report'
        # securepoll
        - name: securepoll
          in: '/+w/rest.php/securepoll(.*)'
          out: '/w/rest.php/securepoll\1'
        # sitemap
        - name: sitemap
          in: '/+w/rest.php/site/v1/sitemap(.*)'
          out: '/w/rest.php/site/v1/sitemap\1'
        # file
        - name: file
          in: '/+w/rest.php/v1/file(.*)'
          out: '/w/rest.php/v1/file\1'
        # page
        - name: page
          in: '/+w/rest.php/v1/page(.*)'
          out: '/w/rest.php/v1/page\1'
        # revision
        - name: revision
          in: '/+w/rest.php/v1/revision(.*)'
          out: '/w/rest.php/v1/revision\1'
        - name: search
          in: '/+w/rest.php/v1/search(.*)'
          out: '/w/rest.php/v1/search\1'
        # transforms - NOTE: these do not overlap (even if they
        # mirror) the existing restbase rules. restbase rules rewrite
        # restbase paths to use the same paths. Both are needed
        - name: transform
          in: '/+w/rest.php/v1/transform(.*)'
          out: '/w/rest.php/v1/transform\1'
        # flaggedrevs
        - name: flaggedrevs
          in: '/+w/rest.php/flaggedrevs(.*)'
          out: '/w/rest.php/flaggedrevs\1'
        # searchvue
        - name: searchvue
          in: '/+w/rest.php/searchvue(.*)'
          out: '/w/rest.php/searchvue\1'
        # wikifunctions
        - name: wikifunctions
          in: '/+w/rest.php/wikifunctions(.*)'
          out: '/w/rest.php/wikifunctions\1'
        - name: wikimediacampaignevents
          in: '/+w/rest.php/wikimediacampaignevents(.*)'
          out: '/w/rest.php/wikimediacampaignevents\1'
        - name: content
          in: '/+w/rest.php/content(.*)'
          out: '/w/rest.php/content\1'
        - name: specs
          in: '/+w/rest.php/specs(.*)'
          out: '/w/rest.php/specs\1'
        - name: wikibase
          in: '/+w/rest.php/wikibase(.*)'
          out: '/w/rest.php/wikibase\1'
        # This case catches remaining rest.php traffic that is not
        # matched by any existing rule. This shouldn't be something we
        # hit, and if it is regularly hit it should be investigated to
        # add suitable rules.
        - name: rest_php_unmatched
          in: '/+w/rest.php(.*)'
          out: '/w/rest.php\1'
        # *** END rest.php APIs ***
        #
        # *** START REST API sandbox ***
        # T396807: REST API sandbox migration (these routes must go after the /?spec routes)
        #
        # It may seem strange to have these here rather than in the mw-api-ext restbase compatible
        # block, but these are not so much APIs as they are webpages, and the host rewriting causes
        # CSP issues that we can't override per-route, breaking JS and CSS.
        - name: rest_sandbox_global
          in: '/wikimedia\.org/v1/'
          out: '/wiki/Special:RestSandbox/wmf-math'
          to: 'meta.wikimedia.org'
          redirect: true
          redirect_code: MOVED_PERMANENTLY
        - name: rest_sandbox_project
          in: '/[^/]+/v1/'
          out: '/wiki/Special:RestSandbox/wmf-rest'
          redirect: true
          redirect_code: MOVED_PERMANENTLY
        # *** END REST API sandbox ***
    # Allow certain action API calls to bypass rate limits
    - name: mw-action-api-nolimit
      timeout: 53s
      cluster_specifier_plugin: mw-api
      csp_enabled: false
      rate_limit_policies: [ "BYPASS", "BYPASS" ]
      urls:
        # Exclude cspreports and login calls from rate limits
        - name: allowed_action
          in: '/+w/api.php(.*)'
          out: '/w/api.php\1'
          query_parameters:
            - name: action
              string_match:
                safe_regex:
                  regex: "^(cspreport|login|clientlogin)$"
        # Exclude token queries from rate limits
        - name: meta_query
          in: '/+w/api.php(.*)'
          out: '/w/api.php\1'
          query_parameters:
            - name: action
              string_match:
                exact: 'query'
            - name: meta
              string_match:
                safe_regex:
                  # Tokens and authmanagerinfo trigger the exemption.
                  # Certain other meta-modules are allowed alongside them (e.g. userinfo),
                  # while most additional modules would cancel the exemption when present.
                  regex: ".*(^|\\||%7[Cc])(tokens|authmanagerinfo)($|\\||%7[Cc]).*"
      lua_hooks:
        # Use a hook to determine whether the request can actually be exempt or not.
        ratelimit: [ "wmf_handle_action_api_nolimit" ]
    # We apply a cost-bassed limit to prevent high load
    - name: mw-action-api-parse
      timeout: 53s
      cluster_specifier_plugin: mw-api
      csp_enabled: false
      rate_limit_policies: [ "May2026", "ParseCost" ]
      urls:
        - name: allowed_action
          in: '/+w/api.php(.*)'
          out: '/w/api.php\1'
          query_parameters:
            - name: action
              string_match:
                exact: 'parse'
    # Assign rate limit policy for abstract.wikipedia.org.
    # Abstract Wikipedia requires a LOT of API queries, they need to have a separate bucket
    # to avoid locking users out of other things inadvertently.
    # NOTE: This will not catch POST requests that do not have the relevant query parameters!
    - name: mw-action-api-abstractwiki
      # We set a higher timeout to allow for long queries
      timeout: 53s
      cluster_specifier_plugin: mw-api
      csp_enabled: false
      domain: abstract.wikipedia.org
      rate_limit_policies: [ "AbstractWiki", "BYPASS" ]
      urls:
        - name: action_api_catchall
          in: '/+w/api.php(.*)'
          out: '/w/api.php\1'
    - name: mw-action-api
      # We set a higher timeout to allow for long queries on the search API
      timeout: 53s
      # This set of routes uses the same cluster as mw-api-ext - however
      # it does NOT use the restbase compability headers as this will
      # lead to incorrect responses from the mw APIs.

      # These routes also do not use the restbase response headers as
      # we will either need to put in a more specific set of headers
      # befitting the mw apis, or to simply defer to the headers
      # mediawiki sends.

      cluster_specifier_plugin: mw-api
      csp_enabled: false
      urls:
        # *** BEGIN action API routes ***
        - name: action_api_catchall
          in: '/+w/api.php(.*)'
          out: '/w/api.php\1'
        # *** END action API routes ***
    - name: linkrecommendation
      timeout: 30s
      cluster: linkrecommendation
      csp_enabled: false
      api_cors_enabled: true
      request_headers_to_remove: ["cookie"]
      response_headers_to_remove: ["set-cookie"]
      response_headers_to_add:
        - key: cache-control
          value: no-cache
      urls:
        - name: catchall
          in: '/+service/linkrecommendation(.*)'
          out: '/\1'
    - name: mw-core-migrated
      timeout: 15s
      # This set of routes uses the same cluster as mw-api-ext - however
      # it does NOT use the restbase compability headers as this will
      # lead to incorrect responses from the mw APIs.

      # These routes also do not use the restbase response headers as
      # we will either need to put in a more specific set of headers
      # befitting the mw apis, or to simply defer to the headers
      # mediawiki sends.

      cluster_specifier_plugin: mw-api
      csp_enabled: false
      api_cors_enabled: true
      request_headers_to_remove: ["cookie"]
      response_headers_to_remove: ["set-cookie"]
      response_headers_to_add:
        - key: cache-control
          value: no-cache
      urls:
        - name: pathing_map_commons
          in: '/+core/v1/commons/(.*)'
          out: '/w/rest.php/v1/\1'
          to: commons.wikimedia.org
        - name: pathing_map_mediawiki
          in: '/+core/v1/mediawiki/(.*)'
          out: '/w/rest.php/v1/\1'
          to: www.mediawiki.org
        - name: pathing_map_wikidata
          in: '/+core/v1/wikidata/(.*)'
          out: '/w/rest.php/v1/\1'
          to: www.wikidata.org
        - name: pathing_map_meta
          in: '/+core/v1/meta/(.*)'
          out: '/w/rest.php/v1/\1'
          to: meta.wikimedia.org
        - name: pathing_map_wikibooks
          in: '/+core/v1/wikibooks/(\w+)/(.*)'
          out: '/w/rest.php/v1/\2'
          to: '\1.wikibooks.org'
        - name: pathing_map_wikinews
          in: '/+core/v1/wikinews/(\w+)/(.*)'
          out: '/w/rest.php/v1/\2'
          to: '\1.wikinews.org'
        - name: pathing_map_wikipedia
          in: '/+core/v1/wikipedia/(\w+)/(.*)'
          out: '/w/rest.php/v1/\2'
          to: '\1.wikipedia.org'
        - name: pathing_map_wikiquote
          in: '/+core/v1/wikiquote/(\w+)/(.*)'
          out: '/w/rest.php/v1/\2'
          to: '\1.wikiquote.org'
        - name: pathing_map_wikisource
          in: '/+core/v1/wikisource/(\w+)/(.*)'
          out: '/w/rest.php/v1/\2'
          to: '\1.wikisource.org'
        - name: pathing_map_wikispecies
          in: '/+core/v1/wikispecies/(\w+)/(.*)'
          out: '/w/rest.php/v1/\2'
          to: '\1.wikispecies.org'
        - name: pathing_map_wikiveristy
          in: '/+core/v1/wikiveristy/(\w+)/(.*)'
          out: '/w/rest.php/v1/\2'
          to: '\1.wikiveristy.org'
        - name: pathing_map_wikivoyage
          in: '/+core/v1/wikivoyage/(\w+)/(.*)'
          out: '/w/rest.php/v1/\2'
          to: '\1.wikivoyage.org'
        - name: pathing_map_wiktionary
          in: '/+core/v1/wiktionary/(\w+)/(.*)'
          out: '/w/rest.php/v1/\2'
          to: '\1.wiktionary.org'

    # T433752: End duplication of MediaWiki API routes for cluster specifier plugin testing.
