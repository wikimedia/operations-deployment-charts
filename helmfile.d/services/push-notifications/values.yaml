docker:
  pull_policy: IfNotPresent
  registry: docker-registry.discovery.wmnet
helm_scaffold_version: 0.2
main_app:
  version: 2025-06-20-153128-publish # need to switch to -$environment
  mwapi_uri: http://localhost:6500/w/api.php
  proxy: http://urldownloader.discovery.wmnet:8080
  no_proxy_list:
    - localhost
  limits:
    memory: 750Mi
config:
  public:
    HTTP_PROXY: http://urldownloader.discovery.wmnet:8080
    HTTPS_PROXY: http://urldownloader.discovery.wmnet:8080
    NO_PROXY: localhost
monitoring:
  enabled: true
resources:
  replicas: 4 
service:
  deployment: production
  port:
    port: 8900
    nodePort: 8900
mesh:
  enabled: true
  telemetry:
    enabled: true
discovery:
  listeners:
    - mw-api-int-async
networkpolicy:
  egress:
    enabled: true
