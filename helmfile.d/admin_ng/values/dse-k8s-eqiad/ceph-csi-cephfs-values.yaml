---
csiConfig:
  - clusterID: &clusterid "6d4278e1-ea45-4d29-86fe-85b44c150813"
    monitors:
      - "cephosd1001:6789"
      - "cephosd1002:6789"
      - "cephosd1003:6789"
      - "cephosd1004:6789"
      - "cephosd1005:6789"

nodeplugin:
  httpMetrics:
    enabled: false
  registrar:
    image:
      repository: docker-registry.discovery.wmnet/repos/data-engineering/kubernetes/csi/csi-node-driver-registrar
      tag: 2026-10-15-084057-beac2117dd029a22a63752985f806196b17d9e97@sha256:95452a50e58d1ecd6073369bcc2b5bd8a7f2f5a5bae4820af42a146b8a7f71cd
  plugin:
    image:
      repository: docker-registry.discovery.wmnet/repos/data-engineering/ceph-csi
      tag: 2026-10-15-082554-b1b0aebdae6ecaff7aae39b9fa723c4246c0824c@sha256:d15fc45172ceb6964c53248df1957ab5053fbd28ed46c6eca208e00817bc6a23
  tolerations:
  # allow the ceph-csi-cephfs pods to run on dedicated workers,
  # as the workload might still require access to Ceph cephfs volumes.
  - key: "dedicated"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "dedicated"
    operator: "Exists"
    effect: "NoExecute"

provisioner:
  provisioner:
    image:
      repository: docker-registry.discovery.wmnet/repos/data-engineering/kubernetes/csi/csi-provisioner
      tag: 2026-10-15-084057-beac2117dd029a22a63752985f806196b17d9e97@sha256:07bea52f84373afe2414a8b8cb9dd19fc58b6acdce40def9ffe02c4599580cba
  attacher:
    image:
      repository: docker-registry.discovery.wmnet/repos/data-engineering/kubernetes/csi/csi-attacher
      tag: 2026-10-15-084057-beac2117dd029a22a63752985f806196b17d9e97@sha256:9ea2d6642958b17a670e8c67cbfb4f0f07a8d5d25fe4fe0f14defa4172d2349d
  resizer:
    image:
      repository: docker-registry.discovery.wmnet/repos/data-engineering/kubernetes/csi/csi-resizer
      tag: 2026-10-15-084057-beac2117dd029a22a63752985f806196b17d9e97@sha256:9b7ac62cbd9e45dc516a33b5a0588083b393342d55b37d5ff8a522e0f4cfca81
  snapshotter:
    enabled: false


storageClass:
  create: true
  classes:
  - name: ceph-cephfs-ssd
    clusterID: *clusterid
    fsName: dpe
    pool: cephfs.dpe.data-ssd
  - name: ceph-cephfs-hdd
    clusterID: *clusterid
    fsName: dpe
    pool: cephfs.dpe.data-hdd
  - name: ceph-cephfs-dumps
    clusterID: *clusterid
    fsName: dumps
    pool: cephfs.dumps.data

secret:
  create: true
  userID: dse-k8s-csi-cephfs
  # userKey: # This value has been added helmfile via the private repo

# The list of namespaces using ceph-cephfs PVCs. If you plan to use such a PVC in a new namespace,
# you'll need to add it in there (please keep the list sorted, after the kube-system entry)
# and apply admin_ng
tenantNamespaces:
- kube-system
- airflow-analytics-product
- airflow-analytics-test
- airflow-dev
- airflow-dumps
- airflow-experiment-platform
- airflow-fr-tech
- airflow-main
- airflow-ml
- airflow-platform-eng
- airflow-research
- airflow-search
- airflow-sre
- airflow-test-k8s
- airflow-wikidata
- airflow-wmde
- analytics
- analytics-test
- growthbook
- growthbook-next
- mediawiki-dumps-legacy
- opensearch-apifeatureusage
- opensearch-apifeatureusage-test
- opensearch-toolhub
- opensearch-toolhub-test
- opensearch-ttmserver
- opensearch-ttmserver-test
