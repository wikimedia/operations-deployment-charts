kubernetesMasters:
  cidrs:
    - '10.192.16.93/32'
    - '2620:0:860:102:10:192:16:93/128'
    - '10.192.48.64/32'
    - '2620:0:860:104:10:192:48:64/128'
# Override policies from ../ml-serve.yaml
GlobalNetworkPolicies:
  allow-pod-to-pod:
    egress:
      - action: Allow
        destination:
          nets:
            # codfw
            - "10.194.61.0/24"
      - action: Allow
        destination:
          nets:
            # codfw
            - "2620:0:860:302::/64"

# Override DNS name on certs to refer to staging endpoint
namespaces:
  knative-serving:
    # Note: We rely on ChangeProp to call LiftWing upon certain
    # Kafka events are emitted. Due to how nodejs works
    # (see https://github.com/nodejs/node/issues/37104) it is
    # not possible to call our inference endpoints with
    # custom HTTP Host headers, unless there are some special
    # SANs in the TLS certificate to support them.
    tlsHostnames:
      - inference-staging
  revertrisk:
    deployClusterRole: deploy-kserve
    deployTLSCertificate: false
    labels:
      istio-injection: enabled
  experimental:
    limitranges:
      container:
        max:
          memory: "75Gi"
      pod:
        max:
          memory: "80Gi"

limitranges:
  container:
    max:
      memory: "30Gi"
  pod:
    max:
      memory: "32Gi"

istio:
  gateways:
    ingressgateway:
      ports:
        - 8443
        # knative-local-gateway (not exposed via NodePort),
        # only for internal traffic.
        - 8081
        # External gRPC port for kserve v2 inference protocol.
        - 50051

# ml-staging-codfw runs kserve 0.20. Prod stays on the versions pinned in
# values/common.yaml.
#
# `~` means "use the newest published chart", the idiom calico already uses for
# staging. Do not pin an explicit version here: CI skips its local-chart patching for
# any release that carries a version, and then cannot resolve a version that this
# change has not published yet (.rake_modules/tester/asset.rb, should_patch?).
chartVersions:
  wmf-stable/kserve-crd-minimal: ~ # Install latest version
  wmf-stable/kserve-resources: ~ # Install latest version
