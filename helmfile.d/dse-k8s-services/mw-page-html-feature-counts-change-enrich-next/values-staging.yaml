# WMF staging main release specific values.

app:
  # These are set in common values.yaml file.
  # Change them here if you need to override them for the staging release.
  #
  version: v1.60.0-dev0
  # logConfiguration:
  #   rootLogger.level: INFO

  taskManager:
    # NOTE: parallelism == TM replicas * numberOfTaskSlots.
    replicas: 10
    resource:
      cpu: 1
      # This pipeline uses a little over 3000m in production, setting it to 4000m as buffer.
      memory: 4000m

  config_files:
    app.config.yaml:

      # Configs for eventutilities python stream_manager.
      stream_manager:
        job_name: mw-page-html-feature-counts-change-enrich-next


        # Configure sources and sinks.
        source:
          stream: mediawiki.page_html_content_change.v1:1.1.0
          # Matches the production release.
          parallelism: 12
          options:
            # Connecting to Jumbo for zstd tests: T429456
            # We'll revert this patch after the test is done.
            bootstrap_servers: kafka-jumbo-eqiad.external-services.svc.cluster.local:9093
            topics: [eqiad.mediawiki.page_html_content_change.v1]
            # Kafka consumer group naming follows convention: <job_name>__<k8s_cluster_name>,
            consumer_group: mw-page-html-feature-counts-change-enrich-next__dse-k8s-eqiad.zstd.000
            properties:
              partition.discovery.interval.ms: "60000"

        sink:
          stream: mediawiki.page_html_feature_counts_change.v1:1.1.0
          options:
            bootstrap_servers: kafka-jumbo-eqiad.external-services.svc.cluster.local:9093
            # Writes to zstd.mediawiki.page_html_feature_counts_change.v1.
            kafka_topic_prefix: zstd.
            properties:
              # Overrides the snappy default set by eventutilities-flink.
              compression.type: zstd

        # By convention we set job_name equal to k8s namespace.
        # Since this naming will contain hyphens, set the error_sink
        # stream name explicitly for production deployments.
        error_sink:
          stream: mw_page_html_feature_counts_change_enrich.error:2.1.0
          options:
            bootstrap_servers: kafka-jumbo-eqiad.external-services.svc.cluster.local:9093
            kafka_topic_prefix: zstd.
  job:
    upgradeMode: stateless


  flinkConfiguration:
    # Parallelism == taskManager.replicas * numberOfTaskSlots.
    # Having fewer TMs results in slightly better resource allocation.
    # Increase numberOfTaskSlots here if more parallelization is needed.
    "taskmanager.numberOfTaskSlots": 1
    # Set the staging release specific HA storageDir path.
    # Note: Naming convention is different than in mw-page-content-change-enrich-next due to swift template in flink chart
    "high-availability.storageDir": "s3://mw-page-html-feature-counts-change-enrich-next.dse-k8s-eqiad/staging/high-availability"

flink:
  object_store:
    # Set the staging release specific objectstore bucket
    swift_bucket: mw-page-html-feature-counts-change-enrich-next.dse-k8s-eqiad

external_services:
  kafka: [jumbo-eqiad]
