app:
  version: v2.3.2-prod@sha256:9f56f007e2e5a17d672dfaf46e4f8cb8dc9dd88bfe864077cb19869aace60164

  service:
    user_agent: Test Kitchen UI/2.0 (#experiment-platform)
    validate_deployment_windows: true

  logging:
    level: info

  database:
    database: test_kitchen_production
    username: test_kitchen_production

  listeners:
    action_api_basepath: http://127.0.0.1:6500

  idp:
    oidc_url: https://idp.wikimedia.org/oidc
    client_id: test_kitchen
    redirect_uri: https://test-kitchen.wikimedia.org/login/callback

  growthbook:
    # http://localhost:6049 is proxied to growthbook-api
    api_url: http://localhost:6049/api/v1/experiments
    ui_url: https://growthbook.wikimedia.org/experiments
    poll_interval_ms: 15000
    timeout_ms: 5000

ingress:
  gatewayHosts:
    extraFQDNs:
    - test-kitchen.wikimedia.org

discovery:
  listeners:
  - mw-api-int-async-ro
  - growthbook-api
