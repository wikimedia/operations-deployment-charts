config:
  airflow:
    instance_name: dumps
    config:
      dag_processor:
        # Airflow 3 reads this key, not the [scheduler] key in the shared values (T402529).
        min_file_process_interval: 300
      kubernetes_executor:
        worker_pods_creation_batch_size: 32
      core:
        parallelism: 128
      scheduler:
        max_tis_per_query: 64
  auth:
    op_ldap_role: airflow-analytics-ops

ingress:
  gatewayHosts:
    default: "airflow-dumps"
    extraFQDNs:
    - airflow-dumps.wikimedia.org

app: # the webserver
  requests:
    memory: 8Gi
  limits:
    memory: 8Gi

scheduler:
  requests:
    cpu: 8
    memory: 4Gi
  limits:
    cpu: 8
    memory: 4Gi

external_services:
  task-pod:
    dumps: [wikimedia]
