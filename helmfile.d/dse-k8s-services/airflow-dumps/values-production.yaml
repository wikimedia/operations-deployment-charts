config:
  airflow:
    instance_name: dumps
    config:
      kubernetes_executor:
        worker_pods_creation_batch_size: 32
      core:
        parallelism: 128
      scheduler:
        max_tis_per_query: 64
  auth:
    op_ldap_role: airflow-analytics-ops


ingress:
  gatewayHosts:
    default: "airflow-dumps"
    extraFQDNs:
    - airflow-dumps.wikimedia.org

app: # the webserver
  version: &base-image-version airflow-3.3.2-py3.11-2026-11-03-131342-88698bdadcc49d1540748393f7cd88e15551e40e@sha256:907c71bfb0ac896c052db76ad32ba456e1d0056f1f015b5fa95354704b821dbc
  executor_pod_image_version: *base-image-version
  requests:
    memory: 8Gi
  limits:
    memory: 8Gi
  liveness_probe:
    failureThreshold: 10
    periodSeconds: 30
    timeoutSeconds: 5
  readiness_probe:
    httpGet:
      path: /api/v2/monitor/health

scheduler:
  requests:
    cpu: 8
    memory: 4Gi
  limits:
    cpu: 8
    memory: 4Gi

external_services:
  task-pod:
    dumps: [wikimedia]
