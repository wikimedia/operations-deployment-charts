# Test the Spark 3.5.8 image here before we deploy it to spark-history.
app:
  image: repos/data-engineering/spark/spark-history
  version: 3.5.8-2026-10-12-103205-e5986ed9ae0e859824975b23c59ba2f40d24656f@sha256:bf423a1c3219db88a430a651f01b74540e51f6cf746f2cee091aa9082af207bb

config:
  hdfs:
    dfs.nameservices: analytics-test-hadoop
    dfs.internal.nameservices: analytics-test-hadoop
    dfs.client.failover.proxy.provider.analytics-test-hadoop: org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
    dfs.ha.namenodes.analytics-test-hadoop: an-test-master1003-eqiad-wmnet,an-test-master1004-eqiad-wmnet
    dfs.namenode.servicerpc-address.analytics-test-hadoop.an-test-master1003-eqiad-wmnet: an-test-master1003.eqiad.wmnet:8040
    dfs.namenode.servicerpc-address.analytics-test-hadoop.an-test-master1004-eqiad-wmnet: an-test-master1004.eqiad.wmnet:8040
    dfs.namenode.rpc-address.analytics-test-hadoop.an-test-master1003-eqiad-wmnet: an-test-master1003.eqiad.wmnet:8020
    dfs.namenode.rpc-address.analytics-test-hadoop.an-test-master1004-eqiad-wmnet: an-test-master1004.eqiad.wmnet:8020
    dfs.namenode.http-address.analytics-test-hadoop.an-test-master1003-eqiad-wmnet: an-test-master1003.eqiad.wmnet:50070
    dfs.namenode.http-address.analytics-test-hadoop.an-test-master1004-eqiad-wmnet: an-test-master1004.eqiad.wmnet:50070

  spark:
    spark.history.kerberos.principal: spark/spark-history-test.svc.eqiad.wmnet

  hadoop:
    fs.defaultFS: hdfs://analytics-test-hadoop/

ingress:
  gatewayHosts:
    default: "spark-history-test"

external_services:
  hadoop-master:
  - analytics-test
  hadoop-worker:
  - analytics-test