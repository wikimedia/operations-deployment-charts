app:
  version: &base-image-version airflow-3.3.2-py3.11-2026-11-04-085408-e2f35447ea725bed18fa40845ddeda388b301085@sha256:d466fbcd33d3d22db15591bd374d84aa3fe09a5001f23d4f3ec9481d5d2938df
  executor_pod_image_version: *base-image-version
  waitForMigrations: true
  args: ["api-server", "--pid" , "/tmp/airflow-webserver.pid"]
  readiness_probe:
    httpGet:
      path: /api/v2/monitor/health

config:
  airflow:
    auth:
      service_token:
        audience: airflow
    config:
      api:
        base_url: "https://{{ $.Values.ingress.gatewayHosts.default }}.wikimedia.org"
      core:
        auth_manager: auth_manager.FabAuthManager
      scheduler:
        standalone_dag_processor: true
        create_cron_data_intervals: true
      webserver:
        base_url: ~

dagProcessor:
  enabled: true

gitsync:
  ref: main_airflow_3.3

scheduler:
  requests:
    memory: 1Gi
