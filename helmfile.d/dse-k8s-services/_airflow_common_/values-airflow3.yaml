app:
  version: &base-image-version next-latest
  executor_pod_image_version: *base-image-version
  waitForMigrations: true
  args: ["api-server", "--pid" , "/tmp/airflow-webserver.pid"]
  readiness_probe:
    httpGet:
      path: /api/v2/monitor/health

docker:
  pull_policy: Always  # needed as we use rolling tag for development

dagProcessor:
  enabled: true

config:
  airflow:
    auth:
      service_token:
        audience: airflow
    config:
      scheduler:
        standalone_dag_processor: true
      core:
        auth_manager: auth_manager.FabAuthManager
