chartName: liftwing-studio

monitoring:
  enabled: true

podSecurityContext:
  fsGroup: 900
  fsGroupChangePolicy: OnRootMismatch

resources:
  replicas: 1

app:
  image: repos/data-engineering/liftwing-studio/librechat
  version: "0.8.7-2026-09-25-090601-cc5510ba9f47f27498015b2194d2e9077d8f2627@sha256:c298fb55e4229e8f33c748e688dbd8be37fa1ef3f636625edcd47578a38c19f6"
  limits:
    cpu: 2
    memory: 2Gi
    ephemeral-storage: 10Gi
  requests:
    cpu: 500m
    memory: 1Gi
    ephemeral-storage: 1Gi
  persistence:
    enabled: true
    storage_class: ceph-rbd-ssd
    size: 10Gi
  database:
    existingSecret: postgresql-liftwing-studio-app
    host: ferretdb
  config:
    version: 1.3.13
    cache: true
    endpoints:
      custom:
        - name: Lift Wing
          apiKey: "${LITELLM_MASTER_KEY}"
          baseURL: http://localhost:4000/v1
          models:
            default:
              - qwen3-14b
              - qwen36-27b
            fetch: false
          titleConvo: true
          titleModel: current_model
          modelDisplayLabel: Lift Wing

litellm:
  image: repos/data-engineering/liftwing-studio/litellm
  version: "1.100.0-2026-09-21-082029-906852c02ff89a2e0bb21486ef8f478b28ce05f5@sha256:3035ec8e96f8c50e31ac55bb07615af65f3d6952318b316735fa0f4b2032be4e"
  limits:
    cpu: 1
    memory: 1Gi
    ephemeral-storage: 5Gi
  requests:
    cpu: 200m
    memory: 512Mi
    ephemeral-storage: 500Mi
  env:
    SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    LITELLM_TELEMETRY: "False"
    LITELLM_LOCAL_MODEL_COST_MAP: "True"
  config:
    model_list:
      - model_name: qwen3-14b
        litellm_params:
          model: hosted_vllm/llm-qwen3-14b
          api_base: https://inference.discovery.wmnet:30443/openai/v1
          extra_headers:
            Host: llm-qwen3-14b.llm.wikimedia.org
      - model_name: qwen36-27b
        litellm_params:
          model: hosted_vllm/llm-qwen36-27b
          api_base: https://inference.discovery.wmnet:30443/openai/v1
          extra_headers:
            Host: llm-qwen36-27b.llm.wikimedia.org
    litellm_settings:
      drop_params: true
      request_timeout: 600
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

config:
  public:
    DOMAIN_CLIENT: "https://liftwing-studio.discovery.wmnet:30443"
    DOMAIN_SERVER: "https://liftwing-studio.discovery.wmnet:30443"
    NO_INDEX: "true"
    ENDPOINTS: "custom"
    SEARCH: "false"
    ALLOW_EMAIL_LOGIN: "false"
    ALLOW_REGISTRATION: "false"
    ALLOW_PASSWORD_RESET: "false"
    ALLOW_SOCIAL_LOGIN: "true"
    OPENID_ISSUER: "https://idp.wikimedia.org/oidc"
    OPENID_CLIENT_ID: "liftwing_studio"
    OPENID_SCOPE: "openid profile email"
    OPENID_CALLBACK_URL: "/oauth/openid/callback"
    OPENID_BUTTON_LABEL: "Wikimedia SSO"
    OPENID_AUTO_REDIRECT: "true"
    OPENID_USERNAME_CLAIM: "preferred_username"
    OPENID_NAME_CLAIM: "name"

service:
  deployment: production

mesh:
  enabled: true
  public_port: 8443
  upstream_timeout: "600s"
  telemetry:
    enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 100Mi
    limits:
      cpu: 1000m
      memory: 500Mi

networkpolicy:
  egress:
    enabled: true
    dst_nets:
    - cidr: 10.2.2.63/32 # inference.svc.eqiad.wmnet
      ports:
      - protocol: tcp
        port: 30443
    - cidr: 10.2.1.63/32 # inference.svc.codfw.wmnet
      ports:
      - protocol: tcp
        port: 30443

external_services:
  cas: [idp]

ingress:
  enabled: true
