chartName: liftwing-studio

monitoring:
  enabled: true
  named_ports: true

podSecurityContext:
  fsGroup: 900
  fsGroupChangePolicy: OnRootMismatch

resources:
  replicas: 1

app:
  image: repos/data-engineering/liftwing-studio/librechat
  version: "0.8.7-2026-10-26-134725-b3d60bed738f50c1304304dc5509d0f6ca094897@sha256:fa9478d9e464f221b7d65031577ad00cf34129973c565ec7372613f59a698922"
  limits:
    cpu: 2
    memory: 2Gi
    ephemeral-storage: 10Gi
  requests:
    cpu: 500m
    memory: 1Gi
    ephemeral-storage: 1Gi
  persistence:
    enabled: true
    storage_class: ceph-rbd-ssd
    size: 10Gi
  database:
    existingSecret: postgresql-liftwing-studio-app
    host: ferretdb
  config:
    version: 1.3.13
    cache: true
    balance:
      enabled: true
      startBalance: 2000000
      autoRefillEnabled: true
      refillIntervalValue: 1
      refillIntervalUnit: days
      refillAmount: 2000000
    endpoints:
      custom:
        - name: Lift Wing
          apiKey: "${LITELLM_MASTER_KEY}"
          baseURL: http://localhost:4000/v1
          models:
            default:
              - qwen3-14b
              - qwen36-27b
              - qwen38-27b
            fetch: false
          titleConvo: true
          titleModel: current_model
          modelDisplayLabel: Lift Wing
          tokenConfig:
            qwen3-14b: {prompt: 1, completion: 4, context: 16384}
            qwen36-27b: {prompt: 1, completion: 4, context: 32768}
            qwen38-27b: {prompt: 1, completion: 4, context: 32768}

litellm:
  image: repos/data-engineering/liftwing-studio/litellm
  version: "1.100.4-2026-10-28-142823-f4d63d6f2f7afde79358999c0dccaa59101ec18f@sha256:7b9552a57acc3e20ebe05683b742cf0610017a163faa1fad1d01421b77023be1"
  limits:
    cpu: 1
    memory: 1Gi
    ephemeral-storage: 5Gi
  requests:
    cpu: 200m
    memory: 512Mi
    ephemeral-storage: 500Mi
  env:
    SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    LITELLM_TELEMETRY: "False"
    LITELLM_LOCAL_MODEL_COST_MAP: "True"
    JSON_LOGS: "true"
    LITELLM_LOG: "WARNING"
  config:
    model_list:
      - model_name: qwen3-14b
        litellm_params:
          model: hosted_vllm/llm-qwen3-14b
          api_base: https://inference.svc.eqiad.wmnet:30443/openai/v1
          extra_headers:
            Host: llm-qwen3-14b.llm.wikimedia.org
      - model_name: qwen36-27b
        litellm_params:
          model: hosted_vllm/llm-qwen36-27b
          api_base: https://inference.svc.eqiad.wmnet:30443/openai/v1
          extra_headers:
            Host: llm-qwen36-27b.llm.wikimedia.org
      - model_name: qwen38-27b
        litellm_params:
          model: hosted_vllm/llm-qwen38-27b
          api_base: https://inference.svc.eqiad.wmnet:30443/openai/v1
          extra_headers:
            Host: llm-qwen38-27b.llm.wikimedia.org
    litellm_settings:
      callbacks: ["prometheus"]
      require_auth_for_metrics_endpoint: false
      drop_params: true
      request_timeout: 600
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY

config:
  public:
    CONSOLE_JSON: "true"
    DOMAIN_CLIENT: "https://hummingbird.wikimedia.org"
    DOMAIN_SERVER: "https://hummingbird.wikimedia.org"
    NO_INDEX: "true"
    ENDPOINTS: "custom"
    SEARCH: "false"
    ALLOW_EMAIL_LOGIN: "false"
    ALLOW_REGISTRATION: "false"
    ALLOW_PASSWORD_RESET: "false"
    ALLOW_SOCIAL_LOGIN: "true"
    OPENID_ISSUER: "https://idp.wikimedia.org/oidc"
    OPENID_CLIENT_ID: "liftwing_studio"
    OPENID_SCOPE: "openid profile email"
    OPENID_CALLBACK_URL: "/oauth/openid/callback"
    OPENID_BUTTON_LABEL: "Wikimedia SSO"
    OPENID_AUTO_REDIRECT: "true"
    OPENID_USERNAME_CLAIM: "preferred_username"
    OPENID_NAME_CLAIM: "name"

service:
  deployment: production

mesh:
  enabled: true
  public_port: 8443
  upstream_timeout: "600s"
  local_access_log_min_code: "500"
  telemetry:
    enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 100Mi
    limits:
      cpu: 1000m
      memory: 500Mi

networkpolicy:
  egress:
    enabled: true
    dst_nets:
    - cidr: 10.2.2.63/32 # inference.svc.eqiad.wmnet
      ports:
      - protocol: tcp
        port: 30443

external_services:
  cas: [idp]

ingress:
  enabled: true
  gatewayHosts:
    default: "liftwing-studio"
    extraFQDNs:
    - hummingbird.wikimedia.org
