_vars:
  spark-image: &spark-image "docker-registry.discovery.wmnet/repos/data-engineering/spark:3.5.8-2026-10-12-103205-e5986ed9ae0e859824975b23c59ba2f40d24656f@sha256:76f0ac5cf946e673e3022224da6d5b40b811c1b0a6402607d554403c81dad2db"

orchestrator:
  service_accounts:
    airflow-test-k8s: [airflow]
    airflow-dev: [airflow-dev-btullis]

external_services:
  hadoop-master:
  - analytics-test
  hadoop-worker:
  - analytics-test
  hive:
  - analytics-test
  kerberos:
  - kdc
  s3:
  - eqiad-dpe

external_services_selector: "spark-role in { 'driver', 'executor' }"

config:
  hadoop:
    hdfs:
      dfs.client.failover.proxy.provider.analytics-test-hadoop: org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
      dfs.ha.namenodes.analytics-test-hadoop: an-test-master1003-eqiad-wmnet,an-test-master1004-eqiad-wmnet
      dfs.internal.nameservices: analytics-test-hadoop
      dfs.namenode.http-address.analytics-test-hadoop.an-test-master1003-eqiad-wmnet: an-test-master1003.eqiad.wmnet:50070
      dfs.namenode.http-address.analytics-test-hadoop.an-test-master1004-eqiad-wmnet: an-test-master1004.eqiad.wmnet:50070
      dfs.namenode.rpc-address.analytics-test-hadoop.an-test-master1003-eqiad-wmnet: an-test-master1003.eqiad.wmnet:8020
      dfs.namenode.rpc-address.analytics-test-hadoop.an-test-master1004-eqiad-wmnet: an-test-master1004.eqiad.wmnet:8020
      dfs.namenode.servicerpc-address.analytics-test-hadoop.an-test-master1003-eqiad-wmnet: an-test-master1003.eqiad.wmnet:8040
      dfs.namenode.servicerpc-address.analytics-test-hadoop.an-test-master1004-eqiad-wmnet: an-test-master1004.eqiad.wmnet:8040
      dfs.nameservices: analytics-test-hadoop
    core:
      fs.defaultFS: hdfs://analytics-test-hadoop/
    hive:
      hive.metastore.kerberos.principal: hive/analytics-test-hive.eqiad.wmnet@WIKIMEDIA
      hive.metastore.uris: thrift://analytics-test-hive.eqiad.wmnet:9083
      hive.server2.authentication.kerberos.principal: analytics/analytics-test.discovery.wmnet@WIKIMEDIA
      hive.server2.authentication.kerberos.keytab: /etc/security/keytabs/analytics.keytab

  spark:
    spark.kubernetes.container.image: *spark-image
    spark.kubernetes.namespace: analytics-test
    spark.kerberos.keytab: /etc/security/keytabs/analytics.keytab
    spark.kerberos.principal: analytics/analytics-test.discovery.wmnet@WIKIMEDIA
    spark.kubernetes.driver.podTemplateFile: local:///etc/spark/pod_templates/driver.yaml
    spark.kubernetes.executor.podTemplateFile: local:///etc/spark/pod_templates/executor.yaml

