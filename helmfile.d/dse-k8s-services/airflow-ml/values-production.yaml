config:
  airflow:
    instance_name: ml

  connections:
    thanos_swift:
      conn_type: aws
      extra:
        endpoint_url: https://thanos-swift.discovery.wmnet
        verify: /etc/ssl/certs/wmf-ca-certificates.crt

# Durable PVC mounted by this instance's KubernetesPodOperator task pods.
# Provisioned with the airflow release (previously a separate wmf-stable/raw
# release). DAGs mount it via the operator's volumes/volume_mounts kwargs.
kubernetes_pod_operator:
  persistent_volume_claims:
    - claim_name: airflow-ml-model-training
      size: 20Gi
      storage_class: ceph-rbd-ssd
      access_mode: ReadWriteOnce

triggerer:
  enabled: true

ingress:
  gatewayHosts:
    default: "airflow-ml"
    extraFQDNs:
    - airflow-ml.wikimedia.org

external_services:
  task-pod:
    thanos-swift: [eqiad, codfw]

# Overrides the shared discovery.listeners (from _airflow_common_) to add the
# TTS section generator. The list replaces rather than merges, so the shared
# entries are repeated here; if a listener is added to the shared file, it
# should be added here too or this instance silently loses it.
discovery:
  listeners:
  - mw-api-int     # to be able to talk to https://meta.wikimedia.org/w/api.php?action=streamsconfig
  - noc            # to be able to talk to https://noc.wikimedia.org/conf/dblists/xxx
  - schema         # to be able to talk to https://schema.discovery.wmnet
  - analytics-web  # to be able to talk to https://analytics.wikimedia.org
  - tts-section-generator  # to be able to talk to https://tts-section-generator.discovery.wmnet
