# WMF staging main release specific values.

app:
  # These are set in common values.yaml file.
  # Change them here if you need to override them for the staging release.
  #
  # logConfiguration:
  #   rootLogger.level: INFO

  version: v1.60.0-dev2

  taskManager:
    # NOTE: parallelism == TM replicas * numberOfTaskSlots.
    replicas: 5
    resource:
      cpu: 2
      memory: 6000m

  flinkVersion: v2_0

  job:
    jarURI: local:///srv/app/usrlib/app-with-dependencies.jar
    entryClass: org.wikimedia.mediawiki.event.enrichment.pagetrending.PageTrending

    # Using stateless only for staging.
    upgradeMode: stateless

  config_files:
    page-trending.properties:
      # Switching to Jumbo for a real data test. This should go back to Test after the test is done.
      kafka-bootstrap-servers: kafka-jumbo-eqiad.external-services.svc.cluster.local:9093
      kafka-consumer-group-id: staging.pageview-trending-relative-next__dse-k8s-eqiad.001
      # Read the real eqiad.-prefixed source topics...
      topic-prefix: eqiad
      # overwrite output topic to avoid collisions with production
      output-topic: staging.pageview.trending.relative.v1
      event-stream-json-schema-urls: file:///srv/app/resources/schema_repo


  flinkConfiguration:
    # Parallelism == taskManager.replicas * numberOfTaskSlots.
    "taskmanager.numberOfTaskSlots": 1
    # Set the staging release specific HA storageDir path.
    # Note: Naming convention is different than in mw-page-content-change-enrich-next due to swift template in flink chart
    "high-availability.storageDir": "s3://pageview-trending-relative-next.dse-k8s-eqiad/staging/high-availability"
    "state.backend.type": "rocksdb"
    "execution.checkpointing.incremental": "true"
    "state.backend.rocksdb.metrics.estimate-num-keys": "true"

flink:
  object_store:
    # Set the staging release specific objectstore bucket
    swift_bucket: pageview-trending-relative-next.dse-k8s-eqiad

external_services:
  kafka: [jumbo-eqiad]
