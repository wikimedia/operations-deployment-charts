# WMF production main release specific values.

app:
  # These are set in common values.yaml file.
  # Change them here if you need to override them for the production release.
  #
  # version: v1.59.0
  # logConfiguration:
  #   rootLogger.level: INFO

  taskManager:
    # NOTE: parallelism == TM replicas * numberOfTaskSlots.
    replicas: 10
    resource:
      cpu: 2
      memory: 3000m

  flinkVersion: v2_0

  job:
    jarURI: local:///srv/app/usrlib/app-with-dependencies.jar
    entryClass: org.wikimedia.mediawiki.event.enrichment.pageview.PageView
    upgradeMode: last-state

  config_files:
    page-view.properties:
      kafka-bootstrap-servers: kafka-jumbo-eqiad.external-services.svc.cluster.local:9093
      kafka-consumer-group-id: webrequest-pageview__dse-k8s-eqiad.001
      event-stream-json-schema-urls: file:///srv/app/resources/schema_repo
      output-topic: eqiad.pageview.v1
      input-topics: webrequest_frontend_text
      wiki-id-miss-threshold: 500
      wiki-id-reload-cooldown: 10 min


  flinkConfiguration:
    # Parallelism == taskManager.replicas * numberOfTaskSlots.
    # Having fewer TMs results in slightly better resource allocation.
    "taskmanager.numberOfTaskSlots": 2
    # Set the production release specific HA storageDir path.
    # Note: Naming convention is different than in mw-page-content-change-enrich due to swift template in flink chart
    "high-availability.storageDir": "s3://webrequest-pageview.dse-k8s-eqiad/production/high-availability"

flink:
  object_store:
    # Set the production release specific objectstore bucket
    swift_bucket: webrequest-pageview.dse-k8s-eqiad

external_services:
  kafka: [jumbo-eqiad]
