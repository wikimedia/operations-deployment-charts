proxy:
  config:
    public:
      QUARKUS_REST_CLIENT_DOWNSTREAM_SPARQL_ENDPOINT_URL: http://wdqs-main-internal-qlever-service:7001/sparql
      EVENTGATE_STREAM: wdqs_internal.sparql_query.v2
      EVENTGATE_GRAPH_NAME: wikidata_main

ingress:
  gatewayHosts:
    default: wdqs2-main-internal

mesh:
  certmanager:
    default_host: wdqs2-main-internal

qlever:
  config:
    public:
      QLEVER_DBNAME: wikidata_main
      QLEVER_MAX_MEM: 130G
      QLEVER_MAX_CACHE: 32G
  requests:
    cpu: 30
    memory: 155Gi
  limits:
    memory: 155Gi

init:
  config:
    public:
      NEW_INDEX_S3_BUCKET: wdqs-update-pipeline
      NEW_INDEX_S3_PATH: qlever-index/wikidata_main
