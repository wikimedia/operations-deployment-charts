resources:
  replicas: 3

backend:
  volume:
    storageClass: topolvm-performance
    # 900Gi should be enough for 3 indices (1 live, 1 backup, 1 temporary when downloading
    # a new index until backups are rotated) and also 2x persisted delta triples.
    size: 900Gi
qlever:
  version: master_2026-08-20T20-33-08Z_1075455
  config:
    public:
      QLEVER_QUERY_TIMEOUT: 60s
      QLEVER_ADDITIONAL_ARGS: --persist-updates --enable-metrics --set-runtime-parameter service-max-redirects=3
      http_proxy: http://urldownloader.discovery.wmnet:8080
  # Memory sizing (requests/limits memory + QLEVER_MAX_MEM/QLEVER_MAX_CACHE) is
  # set per-release so each dataset fits the wdqs namespace quota
  requests: {}
  metricsPort: 7001

init:
  version: v0.1.0
  config:
    public:
      NUM_BACKUPS: 0
      LOGLEVEL: DEBUG
  requests:
    cpu: 2
    memory: 2Gi
  limits:
    cpu: 2
    memory: 2Gi

reindex:
  version: v0.0.5
  config:
    public:
      # Run the rebuild every 8 hours
      SCHEDULE: "00 02,10,18 * * *"
      # To avoid running all replica rebuilds at the same time, we add a random
      # jitter value which will push the rebuild up to 2h.
      JITTER: 7200
      # 3h timeout for the rebuild index request
      TIMEOUT: 10800
  requests:
    cpu: 500m
    memory: 300Mi
  limits:
    cpu: 500m
    memory: 300Mi

consumer:
  version: v0.2.0
  config:
    public:
      BATCH_SIZE: 100000
      BUFFERED_INPUT_MESSAGES: 500
      BATCH_TIMEOUT: 10
      HEAP_SIZE: 2g
      LOG_LEVEL: DEBUG
  metricsPort: 9101
  requests:
    cpu: 2
    memory: 3Gi
  limits:
    cpu: 2
    memory: 3Gi

health:
  version: v0.0.2
  config:
    public:
      QUARKUS_LOG_CATEGORY__org.wikimedia.wdqs__LEVEL: DEBUG
      # Pool the pod as soon as the index is loaded, without waiting for the
      # consumer to catch up with Kafka lag. The health-monitor has no toggle
      # to disable the lag check, so we set the threshold effectively-infinite
      # to neutralise it. The index-loaded check (HEALTH_MONITOR_INDEX_*) still
      # gates the /probe startup check.
      HEALTH_MONITOR_UPDATE_LAG_THRESHOLD: 2147483647
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: 1
    memory: 1Gi

proxy:
  version: v0.12.0
  config:
    public:
      QUARKUS_REST_CLIENT_EVENTGATE_ENDPOINT_URL: http://localhost:6004
      QUARKUS_LOG_CATEGORY__org.wikimedia.wdqs__LEVEL: DEBUG
      QUARKUS_REST_CLIENT_DOWNSTREAM_SPARQL_ENDPOINT_READ_TIMEOUT: 60000
      # QUARKUS_MANAGEMENT_ENABLED=true and QUARKUS_MICROMETER_PROMETHEUS_EXPORT_PATH=/metrics
      # are compiled into the wdqs-proxy binary. Attempting to set them here will have no effect.
      QUARKUS_MANAGEMENT_PORT: 9100
      # QUARKUS_REST_CLIENT_DOWNSTREAM_SPARQL_ENDPOINT_CONNECTION_POOL_SIZE is set per release,
      # next to the QLEVER_NUM_QUERIES it is derived from.
      #
      # The proxy streams the backend response, so a pooled connection is held for
      # the entire duration of a query, not just for the request round-trip. The pool is therefore a
      # concurrency limit on qlever. Once the pool is full, further queries queue until they trip
      # the QUARKUS_REST_CLIENT_DOWNSTREAM_SPARQL_ENDPOINT_READ_TIMEOUT, rather than failing fast.
      #
      # As a baseline we set
      #
      #   connection-pool-size (per proxy pod) == QLEVER_NUM_QUERIES (per qlever pod)
      #
      # Setting it higher pushes the surplus onto qlever, which answers overcapacity with 429. The
      # proxy maps that to a 504, so the excess surfaces to users as gateway timeouts instead of waiting.
      # Setting it lower leaves qlever idle under load.
      QUERY_REWRITER_SPARQL_PREFIXES: |
        # Core Wikidata entities
        PREFIX wd: <http://www.wikidata.org/entity/>
        PREFIX wdata: <http://www.wikidata.org/wiki/Special:EntityData/>
        PREFIX wds: <http://www.wikidata.org/entity/statement/>
        PREFIX wdv: <http://www.wikidata.org/value/>
        PREFIX wdref: <http://www.wikidata.org/reference/>
        # Property types
        PREFIX p: <http://www.wikidata.org/prop/>
        PREFIX wdt: <http://www.wikidata.org/prop/direct/>
        PREFIX wdtn: <http://www.wikidata.org/prop/direct-normalized/>
        PREFIX ps: <http://www.wikidata.org/prop/statement/>
        PREFIX psv: <http://www.wikidata.org/prop/statement/value/>
        PREFIX psn: <http://www.wikidata.org/prop/statement/value-normalized/>
        PREFIX pq: <http://www.wikidata.org/prop/qualifier/>
        PREFIX pqv: <http://www.wikidata.org/prop/qualifier/value/>
        PREFIX pqn: <http://www.wikidata.org/prop/qualifier/value-normalized/>
        PREFIX pr: <http://www.wikidata.org/prop/reference/>
        PREFIX prv: <http://www.wikidata.org/prop/reference/value/>
        PREFIX prn: <http://www.wikidata.org/prop/reference/value-normalized/>
        PREFIX wdno: <http://www.wikidata.org/prop/novalue/>
        # Wikibase ontology
        PREFIX wikibase: <http://wikiba.se/ontology#>
        PREFIX wikibaseqs: <http://wikiba.se/queryService#>
        # Standard external namespaces
        PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
        PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
        PREFIX owl: <http://www.w3.org/2002/07/owl#>
        PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
        PREFIX schema: <http://schema.org/>
        PREFIX prov: <http://www.w3.org/ns/prov#>
        PREFIX dct: <http://purl.org/dc/terms/>
        PREFIX ontolex: <http://www.w3.org/ns/lemon/ontolex#>
        # Geospatial
        PREFIX geo: <http://www.opengis.net/ont/geosparql#>
        PREFIX geof: <http://www.opengis.net/def/geosparql/function/>
        # Blazegraph extensions
        PREFIX bd: <http://www.bigdata.com/rdf#>
        # we need prefix to strip hints from incoming queries.
        PREFIX hint: <http://www.bigdata.com/queryHints#>
  # Bug: T439248
  readiness_probe:
    httpGet:
      path: /health
      port: 8080
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
  requests:
    cpu: 2
    memory: 2Gi
  limits:
    cpu: 2
    memory: 2Gi
  metricsPort: 9100  # matches QUARKUS_MANAGEMENT_PORT

# Envoy service-mesh sidecar tuning for the wdqs-proxy pods.
mesh:
  # Kept above the proxy's 60s request timeout so the two deadlines don't race.
  upstream_timeout: "65s"

  # Custom Envoy histogram buckets for request latency (rq_time).
  #
  # WDQS enforces a 60s response timeout and its latency distribution is
  # skewed toward long-running queries. Over a 90-day sample of successful
  # (200) requests on the current external endpoint (blazegraph, main +
  # scholarly) the observed distribution was:
  #   <10ms       2.0%
  #   10-100ms   54.0%
  #   100ms-1s   38.1%
  #   1s-10s      3.9%
  #   >10s        2.0%
  # The chart-default rq_time bucket set tops out at 2500ms, collapsing the
  # ~6% of requests above ~2s into the overflow bucket and flattening the
  # observed latency profile. Extending rq_time up to the 60s timeout
  # restores resolution across the tail.
  #
  # Overriding envoy_stats_config replaces the chart-default stats_config
  # wholesale, so the remaining match blocks below mirror the chart default
  # (charts/wdqs mesh configuration, https://phabricator.wikimedia.org/T391333).
  envoy_stats_config:
    histogram_bucket_settings:
      - match:
          safe_regex:
            regex: ".+rq_time$"
        buckets: [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 30000, 60000]
      - match: # Included to mirror the chart default
          safe_regex:
            regex: ".+upstream_cx_connect_ms$"
        buckets: [1, 5, 10, 25, 50, 100, 250, 500, 1000]
      - match: # Included to mirror the chart default
          safe_regex:
            regex: ".+(upstream|downstream)_cx_length_ms$"
        buckets: [2500, 5000, 10000, 30000, 60000, 300000]
      - match: # Included to mirror the chart default
          safe_regex:
            regex: ".+"
        buckets: [5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 30000, 60000]
  telemetry:
    enabled: true

networkpolicy:
  egress:
    enabled: true

ingress:
  enabled: true

# gmodena:
# We need egress to gitlab (for the federation allow list), kafka main and S3 in both DCs.
# With maybe cross-dc requests allowed for S3 (do we run the datapipeline and # bucket active-active? Other can of worms).
#
# We also possibly need egress rules EventGate (analytics), if we don't end up producing query telemetry directly into kafka-main.

# And we need egress rules from qlever to federated endpoints (from the allow list).
external_services:
  gitlab:
    - wikimedia
  urldownloader:
    - wikimedia

discovery:
  listeners:
    - eventgate-analytics

# Enable scraping of Prometheus metrics
monitoring:
  enabled: true
  named_ports: true # scrape from all ports wth names ending in "-metrics"

affinity:
  # affinity to bind our backend pod to the wdqs nodes
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
          - key: dedicated
            operator: In
            values:
              - wdqs

# toleration to allow wdqs-backend pods to run on wdqs nodes
tolerations:
  - key: "dedicated"
    operator: "Equal"
    value: "wdqs"
    effect: "NoSchedule"
  - key: "dedicated"
    operator: "Equal"
    value: "wdqs"
    effect: "NoExecute"
