resources:
  replicas: 1

backend:
  volume:
    # We force the wdqs-next deployment onto our test nodes which only
    # provide the balanced storage class for TopoLVM
    storageClass: topolvm-balanced

qlever:
  config:
    public:
      QLEVER_MAX_MEM: 50G
      QLEVER_MAX_CACHE: 16G
  requests:
    cpu: 10
    memory: 60Gi
  limits:
    cpu: 10
    memory: 60Gi

# wdqs-next uses its own ingress/mesh hostnames (wdqs2-next-*) so it does not
# collide with the wdqs namespace, which shares the release values from _wdqs_common_.
# Everything else for this release comes from the shared values-main-external.yaml symlink.
ingress:
  gatewayHosts:
    default: wdqs2-next-main-external
    extraFQDNs: []

mesh:
  certmanager:
    default_host: wdqs2-next-main-external

# Deploy the index from the test bucket to staging, while we gain confidence in the pipeline.
init:
  config:
    public:
      NEW_INDEX_S3_BUCKET: data-reload-test-bucket
