resources:
  replicas: 1

backend:
  volume:
    # We force the wdqs-next deployment onto our test nodes which only
    # provide the balanced storage class for TopoLVM
    storageClass: topolvm-balanced

qlever:
  config:
    public:
      QLEVER_MAX_MEM: 20G
      QLEVER_MAX_CACHE: 8G
  requests:
    cpu: 5
    memory: 30Gi
  limits:
    cpu: 5
    memory: 30Gi
  http_proxy: "http://webproxy:8080"

# wdqs-next uses its own ingress/mesh hostnames (wdqs2-next-*) so it does not
# collide with the wdqs namespace, which shares the release values from _wdqs_common_.
# Everything else for this release comes from the shared values-scholarly-external.yaml symlink.
ingress:
  gatewayHosts:
    default: wdqs2-next-scholarly-external
    extraFQDNs: []

mesh:
  certmanager:
    default_host: wdqs2-next-scholarly-external
