# We currently run a non-official release, which was built on a
# specific commit, to include a couple of features we care about
# [Let launch checklists hide individual built-in items](https://github.com/growthbook/growthbook/pull/7200)
# [Render Markdown links in Custom Hook warnings](https://github.com/growthbook/growthbook/pull/7124)
image: &app_image repos/data-engineering/growthbook/next
version: &app_version 2026-11-10-133045-405fa238f0cd1b04c159e8a789893bbdbe99cee4@sha256:e7e9ed3ac61e92a35826f4cde57a8a58df4823b12ab1d23e426a3e32529cb1ad
app_origin: &app_origin https://growthbook.wikimedia.org
api_host: &api_host https://growthbook-api.wikimedia.org

growthbook-backend:
  app:
    image: *app_image
    version: *app_version

  config:
    public: # See https://docs.growthbook.io/self-host/env
      APP_ORIGIN: *app_origin
      API_HOST: *api_host
      EMAIL_FROM: "growthbook@wikimedia.org"
    oidc:
      clientId: growthbook

  external_services:
    presto: [analytics]
    cas: [idp]

  ingress:
    gatewayHosts:
      default: "growthbook-api"
      extraFQDNs:
      - growthbook-api.wikimedia.org

growthbook-frontend:
  app:
    image: *app_image
    version:  *app_version

  config:
    public: # See https://docs.growthbook.io/self-host/env
      APP_ORIGIN: *app_origin
      API_HOST: *api_host

  ingress:
    gatewayHosts:
      default: "growthbook"
      extraFQDNs:
      - growthbook.wikimedia.org
