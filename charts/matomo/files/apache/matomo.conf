# SPDX-License-Identifier: Apache-2.0
# Matomo application site. Authentication is handled by the upstream CAS proxy.
<VirtualHost *:${APACHE_RUN_PORT}>
    ServerName local.site
    ServerAlias *
    DocumentRoot /srv/app
    DirectoryIndex index.php

    <Directory /srv/app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Match the existing Matomo installation's tracker cache lifetime.
        <FilesMatch "^(piwik|matomo)\.js$">
            Header set Cache-Control "max-age=604800"
        </FilesMatch>
    </Directory>

    # Serve assets directly; PHP endpoints are passed to the existing FPM pool.
    <FilesMatch "\.php$">
        <If "osenv('FCGI_MODE') == 'FCGI_TCP'">
            SetHandler "proxy:fcgi://${FCGI_URL}"
        </If>
        <Else>
            SetHandler "proxy:unix:/run/shared/fpm-www.sock|fcgi://localhost"
        </Else>
    </FilesMatch>

    # .htaccess is disabled, so protect private application files explicitly.
    <DirectoryMatch "^/srv/app/(config|core|misc|tmp|vendor|tests)(/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^(console|composer\.(json|lock)|\..*)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
