{{- /* WMF: upstream removed this template when it dropped PodSecurityPolicy
       support. We keep it, because it grants the nodeplugin the permissions
       that upstream puts in the ClusterRole, but only in the namespaces that
       consume our storage classes. */}}
{{- if .Values.rbac.create }}
{{ range $tenantNamespace := $.Values.tenantNamespaces }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "ceph-csi-rbd.nodeplugin.fullname" $ }}-tenant
  namespace: {{ $tenantNamespace }}
  labels:
    app: {{ include "ceph-csi-rbd.name" $ }}
    chart: {{ include "ceph-csi-rbd.chart" $ }}
    component: {{ $.Values.nodeplugin.name }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    {{- with $.Values.commonLabels }}{{ toYaml . | trim | nindent 4 }}{{- end }}
rules:
{{- if $.Values.storageClass.encrypted }}
  # allow to read Vault Token and connection options from the Tenants namespace
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
{{- end }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
{{- end -}}
{{- end -}}
