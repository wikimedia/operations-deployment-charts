{{- if .Values.rbac.create -}}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "ceph-csi-rbd.provisioner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "ceph-csi-rbd.name" . }}
    chart: {{ include "ceph-csi-rbd.chart" . }}
    component: {{ .Values.provisioner.name }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    {{- with .Values.commonLabels }}{{ toYaml . | trim | nindent 4 }}{{- end }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create","update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
{{- if .Values.secret.create }}
  # WMF: the provisioner ClusterRole cannot read secrets. Name the one secret
  # it needs instead.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "watch", "list"]
    resourceNames: ["{{ .Values.secret.name }}"]
{{- end }}

{{- /* WMF: grant the permissions that upstream puts in the ClusterRole, but
       only in the namespaces that consume our storage classes. */}}
{{ range $tenantNamespace := $.Values.tenantNamespaces }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "ceph-csi-rbd.provisioner.fullname" $ }}-tenant
  namespace: {{ $tenantNamespace }}
  labels:
    app: {{ include "ceph-csi-rbd.name" $ }}
    chart: {{ include "ceph-csi-rbd.chart" $ }}
    component: {{ $.Values.provisioner.name }}
    release: {{ $.Release.Name }}
    heritage: {{ $.Release.Service }}
    {{- with $.Values.commonLabels }}{{ toYaml . | trim | nindent 4 }}{{- end }}
rules:
{{- if $.Values.storageClass.encrypted }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
{{- end }}
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
{{- end -}}
{{- end -}}
