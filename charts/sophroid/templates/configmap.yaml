apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "base.name.release" . }}-config
data:
  service.yaml: |-
    service::catalog:
{{ get .Values "service::catalog" | toYaml | indent 6 }}
  listeners.yaml: |-
    profile::services_proxy::envoy::listen_ipv6: true
    profile::services_proxy::envoy::listeners:
      - name: citoid
        port: 6014
        service: citoid
        timeout: "120s"
        keepalive: "4.5s"
      - name: zotero
        port: 6018
        service: zotero
        timeout: "120s"
        keepalive: "4.5s"
    profile::services_proxy::envoy::enabled_listeners:
      - citoid
      - zotero
    profile::services_proxy::envoy::local_otel_reporting_pct: 0.0
  # Temporarily for prototyping a single service (citoid) reading from Sophroid
  resources.yaml: |-
    resource_catalog:
      citoid:
        encryption: true
        ip:
          codfw:
            default: 10.2.1.19
          eqiad:
            default: 10.2.2.19
        port: 4003
        backends:
        - zotero
      zotero:
        encryption: true
        ip:
          codfw:
            default: 10.2.1.16
          eqiad:
            default: 10.2.2.16
        port: 4969
