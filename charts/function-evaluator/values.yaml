# Default values for function-evaluator.
helm_scaffold_version: 0.4
docker:
  registry: docker-registry.wikimedia.org
  pull_policy: IfNotPresent
resources:
  replicas: 1
main_app:
  type: "default"
  # NOTE: The image: and version: values are over-ridden in the helmfile.d/services/wikifunctions/values-*-evaluator.yaml files
  image: repos/abstract-wiki/wikifunctions/function-evaluator/some-such-image
  version: versionNumberGoesHere
  port: 6927
  command: []
  args: []
  requests:
    cpu: 1
    memory: 800Mi
  limits:
    cpu: 2
    memory: 1Gi
  liveness_probe:
    tcpSocket:
      port: 6927
  readiness_probe:
    httpGet:
      path: /_info
      port: 6927

monitoring:
  enabled: true

service:
  deployment: minikube
  nodePort: false
  port:
    name: http
    targetPort: 6927
    port: 6927
    nodePort: null

config:
  public:
    FUNCTION_EVALUATOR_TIMEOUT_MS: "10000"
  private: {}

mesh:
  enabled: false # Set true in helmfile.d values files.
  public_port: 4970
  upstream_timeout: "180.0s"
  certs:
    cert: "snakeoil"
    key: "snakeoil"
  telemetry:
    enabled: true
    port: 9361

# Envoy config for the evaluator to send function callbacks to the orchestrator.
#
# This is nonstandard. Instead of the cluster-wide services_proxy config inherited from the default
# written by Puppet, we write our own here, with a single "service". Differences:
# - It's backed by the orchestrator's cluster-local Kubernetes service IP (not LVS or Ingress).
# - We override the upstream port to reach an alternate Envoy listener.
# - There's no `upstream.ips` field; instead we'll use a podSelector in the network policy below.
# Everything else is duplicated from the Puppet-generated config.
#
# See mesh.restricted_listeners in values-main-orchestrator.yaml for the destination Envoy config.
# That listener only grants access to the /v1/callback endpoint, which enforces semantic
# restrictions on what functions are allowed to be called from user code. That port is the only
# thing accessible with our network egress policy; that's why this doesn't use the normal
# orchestrator service backed by the cluster ingress, which wouldn't let us enforce that
# restriction.
discovery:
  listeners:
    - wikifunctions-orchestrator-callback
services_proxy:
  wikifunctions-orchestrator-callback:
    port: 6520
    timeout: 9.5s
    upstream:
      address: function-orchestrator-main-orchestrator-tls-service.wikifunctions.svc.cluster.local
      port: &callback_dest_port 4974
      encryption: true
      sets_sni: true
      keepalive: "60s"

debug:
  enabled: false

networkpolicy:
  egress:
    enabled: true
    extraRules:
      - ports:
        - protocol: TCP
          port: *callback_dest_port
        to:
        - podSelector:
            matchLabels:
              app: function-orchestrator

ingress:
  enabled: false
  keepNodePort: false
  staging: false
  gatewayHosts:
    default: ""
    disableDefaultHosts: false
    extraFQDNs: []
  existingGatewayName: ""
  routeHosts: []
  httproutes: []

app:
  port: 6927

dns:
  # If nameserver is set, we'll set a custom dnsPolicy, with that ClusterIP as the nameserver. (In
  # prod, we do this with the ClusterIP for coredns-internalonly in each cluster.) In that case we'll
  # also insert nodeDomain, e.g. "eqiad.wmnet", in the search line so that unqualified hostnames like
  # "foobar1001" are still resolved, just for compatibility. Thus both are set in per-cluster values.
  nameserver: ""
  nodeDomain: ""
