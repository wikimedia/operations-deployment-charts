{{ include "mesh.configuration.configmap" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-configuration
  {{- include "base.meta.labels" . | indent 2 }}
  namespace: {{ .Release.Namespace }}
data:
  metastore-site.xml: |
    {{- include "render_xml_file" ( dict "config" .Values.config.metastore "Root" $) | nindent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-hadoop-configuration
  {{- include "base.meta.labels" . | indent 2 }}
  namespace: {{ .Release.Namespace }}
data:
  core-site.xml: |
    {{- include "render_xml_file" ( dict "config" .Values.config.hadoop "Root" $) | nindent 4 }}
