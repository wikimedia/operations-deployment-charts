main_app:
  site: eqiad

  kafka:
    ssl:
      enabled: false
    broker_list:
      - deployment-kafka-main-5.deployment-prep.eqiad1.wikimedia.cloud:9092
      - deployment-kafka-main-6.deployment-prep.eqiad1.wikimedia.cloud:9092
  concurrency: 1

  changeprop:
    mwapi_uri: http://appservers.svc.deployment-prep.eqiad1.wikimedia.cloud/w/api.php
    event_service_uri: http://deployment-eventgate-5.deployment-prep.eqiad1.wikimedia.cloud:8292/v1/events
    domain_zone: beta\.wmcloud\.org

  log_level: warn
